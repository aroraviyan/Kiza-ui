<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KIZA // ADVANCED COMM HUB</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #030008; 
            background-image: linear-gradient(rgba(170, 0, 255, 0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(170, 0, 255, 0.07) 1px, transparent 1px);
            background-size: 40px 40px; color: #a3a3a3; font-family: 'Courier New', Courier, monospace; 
            margin: 0; padding: 0; display: flex; height: 100dvh; overflow: hidden; 
        }
        body::after {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px; z-index: 999; pointer-events: none;
        }
        .container { display: flex; width: 100%; height: 100%; padding: 25px; gap: 25px; z-index: 10; }
        .side-panel { 
            background: rgba(12, 5, 25, 0.75); backdrop-filter: blur(8px);
            border: 1px solid rgba(170, 0, 255, 0.4); 
            box-shadow: 0 0 20px rgba(170, 0, 255, 0.15), inset 0 0 15px rgba(170, 0, 255, 0.1);
            border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 12px; 
        }
        .left-panel, .right-panel { width: 320px; flex-shrink: 0; }
        .section-title { 
            font-size: 12px; color: #aa00ff; letter-spacing: 3px; text-transform: uppercase; 
            border-bottom: 1px solid rgba(170, 0, 255, 0.3); padding-bottom: 5px; text-shadow: 0 0 5px rgba(170, 0, 255, 0.5);
        }
        .telemetry-row { display: flex; justify-content: space-between; font-size: 12px; }
        .telemetry-val { font-weight: bold; color: #00ffcc; text-shadow: 0 0 8px rgba(0, 255, 204, 0.6); }
        .telemetry-val.master { color: #ff0055; text-shadow: 0 0 8px rgba(255, 0, 85, 0.8); }
        
        .camera-box { 
            width: 100%; height: 140px; background: #000; border: 1px solid rgba(170, 0, 255, 0.5); 
            border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
        }
        .scanner-laser {
            position: absolute; width: 100%; height: 2px;
            background: #00ffcc; box-shadow: 0 0 15px #00ffcc, 0 0 30px #00ffcc;
            top: 0; display: none; z-index: 5;
        }
        @keyframes scanAnim { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

        .face-id-box {
            display: flex; align-items: center; gap: 10px; background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(0, 255, 204, 0.4); padding: 8px; border-radius: 4px; font-size: 11px;
        }
        .face-thumb { width: 42px; height: 42px; border-radius: 4px; border: 1px solid #00ffcc; object-fit: cover; display: none; }
        
        .center-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        .core-assembly { position: relative; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; }
        .core-orb { 
            width: 90px; height: 90px; background: radial-gradient(circle, #e085ff 0%, #aa00ff 40%, #2a0044 80%, #000 100%); 
            border-radius: 50%; box-shadow: 0 0 50px rgba(170, 0, 255, 0.8); animation: pulseOrb 2.5s infinite alternate; z-index: 2; transition: all 0.3s;
        }
        .core-orb.processing { filter: hue-rotate(90deg); box-shadow: 0 0 60px #00ffcc; }
        
        .core-ring { position: absolute; border-radius: 50%; border: 1px dashed rgba(170, 0, 255, 0.6); z-index: 1; }
        .ring-1 { width: 120px; height: 120px; border-top: 2px solid #00ffcc; animation: spinRight 8s linear infinite; }
        .ring-2 { width: 140px; height: 140px; border-bottom: 2px dashed #ff0055; animation: spinLeft 12s linear infinite; }
        .ring-3 { width: 160px; height: 160px; border-right: 2px solid #aa00ff; animation: spinRight 15s linear infinite; }
        
        @keyframes pulseOrb { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }
        @keyframes spinRight { 100% { transform: rotate(360deg); } }
        @keyframes spinLeft { 100% { transform: rotate(-360deg); } }
        
        .status-text { font-size: 14px; letter-spacing: 3px; color: #fff; text-align: center; text-shadow: 0 0 10px #aa00ff; }
        
        .chip-btn {
            background: rgba(0, 255, 204, 0.1); border: 1px solid #00ffcc; color: #00ffcc;
            padding: 6px 12px; font-family: inherit; font-size: 11px; border-radius: 4px; cursor: pointer; text-transform: uppercase;
        }
        .chip-btn:active { background: rgba(0, 255, 204, 0.3); }

        .input-container { 
            display: flex; flex-direction: column; width: 100%; max-width: 600px; gap: 8px; 
            background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid rgba(170, 0, 255, 0.4); border-radius: 6px;
        }
        .input-row { display: flex; gap: 8px; width: 100%; align-items: center; }
        input[type="text"], input[type="password"] { 
            flex: 1; background: transparent; border: none; border-bottom: 1px solid #aa00ff; 
            padding: 8px 10px; color: #00ffcc; font-size: 14px; font-family: inherit; outline: none; width: 100%;
        }
        button.send-btn { 
            background: rgba(170, 0, 255, 0.2); border: 1px solid #aa00ff; color: #e085ff; 
            padding: 8px 14px; cursor: pointer; font-family: inherit; font-weight: bold; border-radius: 4px; white-space: nowrap;
        }
        
        .log-box { flex: 1; overflow-y: auto; font-size: 11px; color: #999; display: flex; flex-direction: column; gap: 8px; line-height: 1.4; max-height: 100%; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 0, 8, 0.95); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center; z-index: 500; padding: 15px;
        }
        .auth-card {
            background: rgba(15, 5, 30, 0.95); border: 1px solid #aa00ff; box-shadow: 0 0 35px rgba(170, 0, 255, 0.4);
            border-radius: 8px; padding: 20px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px;
        }
        .auth-tabs { display: flex; gap: 10px; }
        .tab-btn { flex: 1; padding: 8px; background: transparent; border: 1px solid rgba(170, 0, 255, 0.4); color: #888; font-family: inherit; cursor: pointer; }
        .tab-btn.active { border-color: #00ffcc; color: #00ffcc; background: rgba(0, 255, 204, 0.1); }

        @media (max-width: 900px) {
            body { height: 100dvh; overflow: hidden; }
            .container { flex-direction: column; padding: 10px; gap: 10px; height: 100dvh; max-height: 100dvh; }
            .left-panel { display: none; }
            .center-panel { order: 1; flex: 0 0 auto; gap: 10px; padding: 5px 0; }
            .core-assembly { width: 90px; height: 90px; }
            .core-orb { width: 50px; height: 50px; box-shadow: 0 0 25px rgba(170, 0, 255, 0.8); }
            .ring-1 { width: 70px; height: 70px; }
            .ring-2 { width: 80px; height: 80px; }
            .ring-3 { width: 90px; height: 90px; }
            .status-text { font-size: 11px; letter-spacing: 1px; }
            .right-panel { order: 2; flex: 1; width: 100%; min-height: 0; margin-bottom: 5px; }
            .center-panel .input-container { order: 3; width: 100%; margin-bottom: 5px; }
        }
    </style>
</head>
<body>

    <div id="authModal" class="modal-overlay">
        <div class="auth-card">
            <div class="section-title">KIZA // IDENTITY GATE</div>
            <div class="auth-tabs">
                <button id="loginTab" class="tab-btn active" onclick="switchAuthMode('login')">LOGIN</button>
                <button id="signupTab" class="tab-btn" onclick="switchAuthMode('signup')">SIGN UP / RESET</button>
            </div>
            <input type="text" id="authUser" placeholder="Enter Identity Name..." autocomplete="off">
            <input type="password" id="authPass" placeholder="Enter Security Passcode...">
            <label style="font-size: 11px; color: #ccc; display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <input type="checkbox" id="captureFaceCheck" checked> Scan & Lock Biometric Face ID
            </label>
            <div id="authError" style="color: #ff0055; font-size: 11px; min-height: 14px;"></div>
            <button class="send-btn" onclick="performAuth()" style="width: 100%; padding: 12px;">VERIFY IDENTITY</button>
        </div>
    </div>

    <div class="container">
        <div class="side-panel left-panel">
            <div class="section-title">SYSTEM TELEMETRY</div>
            <div class="telemetry-row"><span>PROTOCOL</span><span class="telemetry-val">ACTIVE</span></div>
            <div class="telemetry-row"><span>IDENTITY</span><span id="idVal" class="telemetry-val">UNVERIFIED</span></div>
            <div class="telemetry-row"><span>CLEARANCE</span><span id="roleVal" class="telemetry-val">LOCKED</span></div>
            
            <div class="camera-box">
                <video id="webcamVideo" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: cover; display: none;"></video>
                <canvas id="faceCanvas" width="160" height="120" style="display:none;"></canvas>
                <div id="laser" class="scanner-laser"></div>
                <span id="camStatus" style="color:#553377; position: absolute;">Camera Offline...</span>
            </div>
            <button class="chip-btn" onclick="switchCamera()" style="border-color: #aa00ff; color: #e085ff;">🔄 FLIP CAMERA</button>
            
            <button class="chip-btn" id="voiceToggleBtn" onclick="toggleVoiceMute()" style="border-color: #00ffcc; color: #00ffcc; margin-top: 5px;">🔊 VOICE: ON</button>

            <div class="face-id-box" style="margin-top: 5px;">
                <img id="savedFaceImg" class="face-thumb" alt="Biometric Face ID">
                <div>
                    <div style="color: #aa00ff; font-weight: bold;">BIOMETRIC ID</div>
                    <div id="faceIdStatus" style="color: #888;">Awaiting Scan...</div>
                </div>
            </div>
            <button class="chip-btn" onclick="updateFaceID()" style="border-color: #00ffcc; color: #00ffcc;">🧬 RE-SCAN FACE ID</button>
            <button class="chip-btn" onclick="logoutUser()" style="margin-top: auto; border-color: #ff0055; color: #ff0055;">SWITCH IDENTITY</button>
        </div>

        <div class="center-panel">
            <div class="core-assembly">
                <div class="core-ring ring-1"></div>
                <div class="core-ring ring-2"></div>
                <div class="core-ring ring-3"></div>
                <div id="orb" class="core-orb"></div>
            </div>
            <div id="uiStatus" class="status-text">AWAITING IDENTITY...</div>
            
            <div class="input-container">
                <!-- PERSONALITY SELECTOR -->
                <select id="personaSelect" class="chip-btn" style="border-color: #aa00ff; color: #e085ff; outline: none; margin-bottom: 5px; width: 100%; text-align: center;">
                    <option value="roast">🔥 ROASTING MODE</option>
                    <option value="polite">🛡️ POLITE MODE</option>
                </select>

                <div class="input-row">
                    <button class="chip-btn" id="mobileVoiceBtn" onclick="toggleVoiceMute()" title="Toggle Voice" style="padding: 6px; font-size: 14px;">🔊</button>
                    <button class="chip-btn" id="micBtn" style="padding: 6px; font-size: 16px;" onclick="toggleSpeechRecognition()" title="Voice Input">🎤</button>
                    <input type="text" id="textInput" placeholder="Speak or type command...">
                    <button class="send-btn" onclick="submitCommand()">TRANSMIT</button>
                </div>
            </div>
        </div>

        <div class="side-panel right-panel">
            <div class="section-title">LIVE ACTION FEED</div>
            <div id="actionLog" class="log-box">
                <div>> [KIZA SYSTEM]: HUD online. System ready.</div>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = "https://kiza-brain.onrender.com";
        let currentUser = "Guest";
        let currentRole = "LOCKED";
        let authMode = "login";
        
        let cameraReady = false;
        let videoDevices = [];
        let currentCamIndex = 0;
        let activeStream = null;

        let recognition = null;
        let isRecording = false;

        let voiceEnabled = true;
        let currentAudio = null;
        
        let typingTimer; // Used for "User is typing..." timeout

        // Safe Scanner Animation (Won't crash if camera is hidden)
        function triggerScanAnimation() {
            try {
                const laser = document.getElementById('laser');
                if (laser) {
                    laser.style.display = "block";
                    laser.style.animation = "scanAnim 1.5s ease-in-out";
                    setTimeout(() => { laser.style.display = "none"; laser.style.animation = "none"; }, 1500);
                }
            } catch (e) {}
        }

        function toggleVoiceMute() {
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById('voiceToggleBtn');
            const mobileBtn = document.getElementById('mobileVoiceBtn');
            if (voiceEnabled) {
                if(btn) { btn.innerText = "🔊 VOICE: ON"; btn.style.borderColor = "#00ffcc"; btn.style.color = "#00ffcc"; }
                if(mobileBtn) mobileBtn.innerText = "🔊";
                logAction("[SYSTEM]: Voice synthesis enabled.", "#00ffcc");
            } else {
                if(btn) { btn.innerText = "🔇 VOICE: MUTED"; btn.style.borderColor = "#ff0055"; btn.style.color = "#ff0055"; }
                if(mobileBtn) mobileBtn.innerText = "🔇";
                if (currentAudio) { currentAudio.pause(); currentAudio = null; }
                logAction("[SYSTEM]: Voice synthesis muted.", "#ff0055");
            }
        }

        function playKizaAudio(base64Data) {
            if (!voiceEnabled || !base64Data) return;
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            currentAudio = new Audio("data:audio/mp3;base64," + base64Data);
            currentAudio.play().catch(e => console.log("Audio play blocked/interrupted"));
        }

        async function initCamera(deviceId = null) {
            try {
                if (activeStream) activeStream.getTracks().forEach(track => track.stop());
                const constraints = deviceId ? { video: { deviceId: { exact: deviceId } } } : { video: { facingMode: "user" } };
                activeStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                const videoElement = document.getElementById('webcamVideo');
                videoElement.srcObject = activeStream;
                videoElement.style.display = "block";
                document.getElementById('camStatus').style.display = "none";
                cameraReady = true;

                const devices = await navigator.mediaDevices.enumerateDevices();
                videoDevices = devices.filter(d => d.kind === 'videoinput');
            } catch (error) {
                document.getElementById('camStatus').innerText = "CAMERA OFFLINE";
                document.getElementById('camStatus').style.color = "#ff0055";
            }
        }

        window.onload = () => {
            initCamera();
            const savedUser = localStorage.getItem('kiza_user');
            const savedRole = localStorage.getItem('kiza_
