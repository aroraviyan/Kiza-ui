<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KIZA // ADVANCED COMM HUB</title>
    <style>
        body { 
            background-color: #030008; 
            background-image: 
                linear-gradient(rgba(170, 0, 255, 0.07) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(170, 0, 255, 0.07) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #a3a3a3; 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
        }
        .container { 
            display: flex; 
            width: 100%; 
            height: 100%; 
            padding: 30px; 
            box-sizing: border-box; 
            gap: 30px; 
            z-index: 10;
        }
        .side-panel { 
            background: rgba(12, 5, 25, 0.65); 
            backdrop-filter: blur(8px);
            border: 1px solid rgba(170, 0, 255, 0.4); 
            box-shadow: 0 0 20px rgba(170, 0, 255, 0.15), inset 0 0 15px rgba(170, 0, 255, 0.1);
            border-radius: 8px; 
            padding: 25px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            position: relative;
        }
        .left-panel { width: 320px; box-sizing: border-box; }
        .right-panel { width: 320px; box-sizing: border-box; }
        .section-title { 
            font-size: 12px; 
            color: #aa00ff; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            margin-bottom: 5px; 
            border-bottom: 1px solid rgba(170, 0, 255, 0.3);
            padding-bottom: 5px;
            text-shadow: 0 0 5px rgba(170, 0, 255, 0.5);
        }
        .telemetry-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 10px; }
        .telemetry-val { font-weight: bold; color: #00ffcc; text-shadow: 0 0 8px rgba(0, 255, 204, 0.6); }
        .telemetry-val.locked { color: #ff0055; text-shadow: 0 0 8px rgba(255, 0, 85, 0.6); }
        .camera-box { 
            width: 100%; 
            height: 160px; 
            background: #000; 
            border: 1px solid rgba(170, 0, 255, 0.5); 
            border-radius: 4px; 
            object-fit: cover; 
            filter: contrast(1.1) brightness(1.1);
        }
        .center-panel { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            gap: 50px; 
        }
        .core-assembly {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .core-orb { 
            width: 120px; 
            height: 120px; 
            background: radial-gradient(circle, #e085ff 0%, #aa00ff 40%, #2a0044 80%, #000 100%); 
            border-radius: 50%; 
            box-shadow: 0 0 60px rgba(170, 0, 255, 0.8), 0 0 120px rgba(170, 0, 255, 0.4); 
            animation: pulseOrb 2.5s infinite alternate; 
            z-index: 2;
        }
        .core-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px dashed rgba(170, 0, 255, 0.6);
            z-index: 1;
        }
        .ring-1 { width: 160px; height: 160px; border-top: 2px solid #00ffcc; animation: spinRight 8s linear infinite; }
        .ring-2 { width: 190px; height: 190px; border-bottom: 2px dashed #ff0055; animation: spinLeft 12s linear infinite; }
        .ring-3 { width: 220px; height: 220px; border: 1px solid rgba(170, 0, 255, 0.2); border-right: 2px solid #aa00ff; animation: spinRight 15s linear infinite; }
        @keyframes pulseOrb { 
            0% { transform: scale(0.95); box-shadow: 0 0 40px rgba(170, 0, 255, 0.5); filter: hue-rotate(0deg); } 
            100% { transform: scale(1.05); box-shadow: 0 0 80px rgba(170, 0, 255, 0.9); filter: hue-rotate(15deg); } 
        }
        @keyframes spinRight { 100% { transform: rotate(360deg); } }
        @keyframes spinLeft { 100% { transform: rotate(-360deg); } }
        .status-text { 
            font-size: 18px; 
            letter-spacing: 5px; 
            color: #fff; 
            text-align: center; 
            text-shadow: 0 0 10px #aa00ff;
        }
        .input-container { 
            display: flex; 
            width: 80%; 
            max-width: 600px; 
            gap: 15px; 
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border: 1px solid rgba(170, 0, 255, 0.3);
            border-radius: 4px;
        }
        input[type="text"] { 
            flex: 1; 
            background: transparent; 
            border: none; 
            border-bottom: 1px solid #aa00ff; 
            padding: 10px 15px; 
            color: #00ffcc; 
            font-size: 14px;
            font-family: inherit; 
            outline: none; 
        }
        button.send-btn { 
            background: rgba(170, 0, 255, 0.1); 
            border: 1px solid #aa00ff; 
            color: #aa00ff; 
            padding: 0 25px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        .log-box { 
            flex: 1; 
            background: transparent; 
            overflow-y: auto; 
            font-size: 11px; 
            color: #999; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="side-panel left-panel">
            <div class="section-title">SYSTEM TELEMETRY</div>
            <div class="telemetry-row"><span>CORE PROTOCOL</span><span class="telemetry-val">ACTIVE</span></div>
            <div class="camera-box" style="display:flex; align-items:center; justify-content:center; color:#553377;">Awaiting Signal...</div>
        </div>
        <div class="center-panel">
            <div class="core-assembly">
                <div class="core-ring ring-1"></div>
                <div class="core-ring ring-2"></div>
                <div class="core-ring ring-3"></div>
                <div class="core-orb"></div>
            </div>
            <div id="uiStatus" class="status-text">KIZA WAITING FOR INPUT...</div>
            <div class="input-container">
                <input type="text" id="textInput" placeholder="Awaiting command...">
                <button class="send-btn" onclick="submitCommand()">TRANSMIT</button>
            </div>
        </div>
        <div class="side-panel right-panel">
            <div class="section-title">LIVE ACTION FEED</div>
            <div id="actionLog" class="log-box">
                <div>> [KIZA SYSTEM]: Secure UI interface rendered...</div>
            </div>
        </div>
    </div>
</body>
</html>
