<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>KIZA // ADVANCED COMM HUB</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; }
        
        /* ORIGINAL DARK NEON THEME (Optional) */
        body.dark-mode { 
            background-color: #030008; 
            background-image: linear-gradient(rgba(170, 0, 255, 0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(170, 0, 255, 0.07) 1px, transparent 1px);
            color: #a3a3a3; 
        }
        body.dark-mode .side-panel, body.dark-mode .auth-card, body.dark-mode .logs-card { 
            background: rgba(12, 5, 25, 0.75); 
            border-color: rgba(170, 0, 255, 0.4); 
            box-shadow: 0 0 20px rgba(170, 0, 255, 0.15), inset 0 0 15px rgba(170, 0, 255, 0.1);
        }
        body.dark-mode .section-title { color: #aa00ff; border-bottom-color: rgba(170, 0, 255, 0.3); text-shadow: 0 0 5px rgba(170, 0, 255, 0.5); }
        body.dark-mode .telemetry-val { color: #00ffcc; text-shadow: 0 0 8px rgba(0, 255, 204, 0.6); }
        body.dark-mode .telemetry-val.master { color: #ff0055; text-shadow: 0 0 8px rgba(255, 0, 85, 0.8); }
        body.dark-mode .chip-btn { border-color: #00ffcc; color: #00ffcc; background: rgba(0, 255, 204, 0.1); }
        body.dark-mode .send-btn { border-color: #aa00ff; color: #e085ff; background: rgba(170, 0, 255, 0.2); }
        body.dark-mode .log-box, body.dark-mode .logs-viewer { color: #999; background: transparent; }
        body.dark-mode input[type="text"], body.dark-mode input[type="password"], body.dark-mode select { color: #00ffcc; border-bottom-color: #aa00ff; background: rgba(0,0,0,0.8); }
        body.dark-mode .input-container { background: rgba(0,0,0,0.8); border-color: rgba(170, 0, 255, 0.4); }

        /* DEFAULT LIGHT WHITE / SKY BLUE THEME */
        body { 
            background-color: #f4f7f9; 
            background-image: none;
            background-size: 40px 40px; color: #333; font-family: 'Courier New', Courier, monospace; 
            margin: 0; padding: 0; display: flex; height: 100dvh; overflow: hidden; 
        }
        body::after {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.05) 50%);
            background-size: 100% 4px; z-index: 999; pointer-events: none;
        }
        
        .side-panel, .auth-card, .logs-card { 
            background: #ffffff; backdrop-filter: blur(8px);
            border: 1px solid #87CEEB; 
            box-shadow: 0 4px 15px rgba(135, 206, 235, 0.2);
            border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 12px; 
        }
        .section-title { 
            font-size: 12px; color: #4682B4; letter-spacing: 3px; text-transform: uppercase; 
            border-bottom: 1px solid #87CEEB; padding-bottom: 5px; font-weight: bold;
        }
        .telemetry-row { display: flex; justify-content: space-between; font-size: 12px; }
        .telemetry-val { font-weight: bold; color: #007BFF; }
        .telemetry-val.master { color: #d9534f; }
        
        .chip-btn {
            background: rgba(135, 206, 235, 0.15); border: 1px solid #87CEEB; color: #4682B4;
            padding: 6px 12px; font-family: inherit; font-size: 11px; border-radius: 4px; cursor: pointer; text-transform: uppercase; font-weight: bold;
        }
        .chip-btn:active { background: rgba(135, 206, 235, 0.3); }
        .send-btn { 
            background: #87CEEB; border: 1px solid #4682B4; color: #fff; 
            padding: 8px 14px; cursor: pointer; font-family: inherit; font-weight: bold; border-radius: 4px; white-space: nowrap;
        }

        .input-container { 
            display: flex; flex-direction: column; width: 100%; max-width: 600px; gap: 8px; 
            background: #ffffff; padding: 10px; border: 1px solid #87CEEB; border-radius: 6px; box-shadow: 0 4px 15px rgba(135, 206, 235, 0.15);
        }
        input[type="text"], input[type="password"], select { 
            flex: 1; background: transparent; border: none; border-bottom: 1px solid #87CEEB; 
            padding: 8px 10px; color: #333; font-size: 14px; font-family: inherit; outline: none; width: 100%;
        }
        .log-box, .logs-viewer { flex: 1; overflow-y: auto; font-size: 11px; color: #444; display: flex; flex-direction: column; gap: 8px; line-height: 1.4; max-height: 100%; background: #fdfdfd; padding: 10px; border: 1px solid #e0f0ff; border-radius: 4px;}

        /* LAYOUT & UNIVERSAL COMPONENTS */
        #notificationBox {
            position: fixed; top: 20px; right: -400px; width: 320px;
            background: rgba(255, 255, 255, 0.95); border: 1px solid #87CEEB; box-shadow: 0 0 20px rgba(135, 206, 235, 0.4); color: #333;
            padding: 15px; border-radius: 8px; z-index: 9999; transition: right 0.4s; font-size: 12px; display: flex; flex-direction: column; gap: 8px;
        }
        body.dark-mode #notificationBox { background: rgba(15, 5, 30, 0.95); border-color: #00ffcc; color: #00ffcc; }
        
        #notificationBox.show { right: 20px; }
        .notify-title { font-weight: bold; font-size: 11px; letter-spacing: 2px; border-bottom: 1px solid rgba(135, 206, 235, 0.5); padding-bottom: 5px; text-transform: uppercase; }
        
        .container { display: flex; width: 100%; height: 100%; padding: 25px; gap: 25px; z-index: 10; }
        .left-panel, .right-panel { width: 320px; flex-shrink: 0; }
        
        .camera-box { 
            width: 100%; height: 140px; background: #000; border: 1px solid #87CEEB; 
            border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
        }
        body.dark-mode .camera-box { border-color: rgba(170, 0, 255, 0.5); }

        .face-id-box {
            display: flex; align-items: center; gap: 10px; background: rgba(135, 206, 235, 0.1);
            border: 1px dashed #87CEEB; padding: 8px; border-radius: 4px; font-size: 11px;
        }
        body.dark-mode .face-id-box { background: rgba(0,0,0,0.4); border-color: rgba(0,255,204,0.4); }
        .face-thumb { width: 42px; height: 42px; border-radius: 4px; border: 1px solid #87CEEB; object-fit: cover; display: none; }
        
        .center-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        .core-assembly { position: relative; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; }
        .core-orb { 
            width: 90px; height: 90px; background: radial-gradient(circle, #87CEEB 0%, #4682B4 40%, #002244 80%, #000 100%); 
            border-radius: 50%; box-shadow: 0 0 50px rgba(135, 206, 235, 0.8); animation: pulseOrb 2.5s infinite alternate; z-index: 2; transition: all 0.3s;
        }
        body.dark-mode .core-orb { background: radial-gradient(circle, #e085ff 0%, #aa00ff 40%, #2a0044 80%, #000 100%); box-shadow: 0 0 50px rgba(170, 0, 255, 0.8); }
        .core-orb.processing { filter: hue-rotate(90deg); box-shadow: 0 0 60px #00ffcc; }
        
        .core-ring { position: absolute; border-radius: 50%; border: 1px dashed #87CEEB; z-index: 1; }
        body.dark-mode .core-ring { border-color: rgba(170, 0, 255, 0.6); }
        .ring-1 { width: 120px; height: 120px; border-top: 2px solid #007BFF; animation: spinRight 8s linear infinite; }
        .ring-2 { width: 140px; height: 140px; border-bottom: 2px dashed #4682B4; animation: spinLeft 12s linear infinite; }
        .ring-3 { width: 160px; height: 160px; border-right: 2px solid #87CEEB; animation: spinRight 15s linear infinite; }
        
        @keyframes pulseOrb { 0% { transform: scale(0.95); } 100% { transform: scale(1.05); } }
        @keyframes spinRight { 100% { transform: rotate(360deg); } }
        @keyframes spinLeft { 100% { transform: rotate(-360deg); } }
        
        .status-text { font-size: 14px; letter-spacing: 3px; color: #4682B4; text-align: center; text-shadow: 0 0 10px rgba(135,206,235,0.5); font-weight:bold; }
