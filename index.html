<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KIZA // ADVANCED COMM HUB</title>
    <style>
        /* --- CORE BACKGROUND & HUD GRID --- */
        body { 
            background-color: #030008; 
            background-image: 
                linear-gradient(rgba(170, 0, 255, 0.07) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(170, 0, 255, 0.07) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #a3a3a3; 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
        }

        .container { 
            display: flex; 
            width: 100%; 
            height: 100%; 
            padding: 30px; 
            box-sizing: border-box; 
            gap: 30px; 
            z-index: 10;
        }

        /* --- GLASSMORPHISM PANELS --- */
        .side-panel { 
            background: rgba(12, 5, 25, 0.65); 
            backdrop-filter: blur(8px);
            border: 1px solid rgba(170, 0, 255, 0.4); 
            box-shadow: 0 0 20px rgba(170, 0, 255, 0.15), inset 0 0 15px rgba(170, 0, 255, 0.1);
            border-radius: 8px; 
            padding: 25px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            position: relative;
        }
        
        .side-panel::before, .side-panel::after {
            content: ''; position: absolute; width: 15px; height: 15px; border: 2px solid #aa00ff;
        }
        .side-panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .side-panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .left-panel { width: 320px; box-sizing: border-box; }
        .right-panel { width: 320px; box-sizing: border-box; }

        .section-title { 
            font-size: 12px; 
            color: #aa00ff; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            margin-bottom: 5px; 
            border-bottom: 1px solid rgba(170, 0, 255, 0.3);
            padding-bottom: 5px;
            text-shadow: 0 0 5px rgba(170, 0, 255, 0.5);
        }

        .telemetry-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 10px; }
        .telemetry-val { font-weight: bold; color: #00ffcc; text-shadow: 0 0 8px rgba(0, 255, 204, 0.6); }
        .telemetry-val.locked { color: #ff0055; text-shadow: 0 0 8px rgba(255, 0, 85, 0.6); }
        
        .camera-box { 
            width: 100%; 
            height: 160px; 
            background: #000; 
            border: 1px solid rgba(170, 0, 255, 0.5); 
            border-radius: 4px; 
            object-fit: cover; 
            filter: contrast(1.1) brightness(1.1);
        }

        /* --- ADVANCED KIZA CORE --- */
        .center-panel { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            gap: 50px; 
        }

        .core-assembly {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            width: 120px; 
            height: 120px; 
            background: radial-gradient(circle, #e085ff 0%, #aa00ff
