<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KIZA LIVE — Real-Time AI Video & Voice Call</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030611;
            --accent-cyan: #00f2fe;
            --accent-purple: #a855f7;
            --accent-green: #10b981;
            --danger: #f43f5e;
            --warning: #fbbf24;
            --glass-bg: rgba(11, 16, 33, 0.78);
            --glass-border: rgba(0, 242, 254, 0.32);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: radial-gradient(circle at 50% 35%, #130b2e 0%, #050816 60%, #020308 100%);
            color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            user-select: none;
        }

        /* Subtle Tactical Grid Overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(to right, rgba(0, 242, 254, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(168, 85, 247, 0.04) 1px, transparent 1px);
            background-size: 42px 42px;
            pointer-events: none;
            z-index: 1;
        }

        /* TOP CALL STATUS BAR */
        .top-bar {
            width: 100%;
            max-width: 960px;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            gap: 12px;
            flex-wrap: wrap;
        }

        .call-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: 999px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 1.5px;
            font-weight: 700;
            color: var(--accent-cyan);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
        }

        .live-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 12px var(--accent-green);
            animation: blinkDot 1.4s infinite alternate;
        }
        @keyframes blinkDot {
            from { opacity: 0.45; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1.15); }
        }

        .top-right-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .persona-pill {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            color: #e2e8f0;
            padding: 8px 14px;
            border-radius: 999px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        /* FLOATING PICTURE-IN-PICTURE CAMERA PREVIEW */
        .pip-camera-card {
            position: fixed;
            top: 82px;
            right: 24px;
            width: 210px;
            height: 150px;
            background: #050811;
            border: 1.5px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            z-index: 25;
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.65), 0 0 20px rgba(0, 242, 254, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .pip-camera-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        .pip-camera-card.rear-lens video {
            transform: scaleX(1);
        }
        .pip-label {
            position: absolute;
            bottom: 8px;
            left: 10px;
            background: rgba(3, 6, 17, 0.75);
            backdrop-filter: blur(6px);
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9.5px;
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 242, 254, 0.3);
        }
        .vision-scan-line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            box-shadow: 0 0 8px var(--accent-cyan);
            animation: scanCam 3s linear infinite;
            pointer-events: none;
        }
        @keyframes scanCam {
            0% { top: 5%; opacity: 0.2; }
            50% { top: 92%; opacity: 0.85; }
            100% { top: 5%; opacity: 0.2; }
        }

        /* CENTER STAGE: AUDIO-REACTIVE QUANTUM ORB & SUBTITLES */
        .center-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            z-index: 10;
            width: 100%;
            max-width: 780px;
            padding: 0 20px;
            text-align: center;
        }

        .orb-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .live-ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .l-ring-1 {
            width: 175px;
            height: 175px;
            border: 2px dashed rgba(0, 242, 254, 0.55);
            border-top: 3px solid var(--accent-cyan);
            animation: spinCW 8s linear infinite;
        }
        .l-ring-2 {
            width: 212px;
            height: 212px;
            border: 1.5px solid rgba(168, 85, 247, 0.35);
            border-bottom: 3px dashed var(--accent-purple);
            animation: spinCCW 12s linear infinite;
        }
        .l-ring-3 {
            width: 246px;
            height: 246px;
            border: 1px dashed rgba(0, 242, 254, 0.25);
            border-left: 2.5px solid var(--accent-cyan);
            animation: spinCW 18s linear infinite;
        }

        @keyframes spinCW { 100% { transform: rotate(360deg); } }
        @keyframes spinCCW { 100% { transform: rotate(-360deg); } }

        .live-orb {
            width: 124px;
            height: 124px;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 32%, #ffffff 0%, #38bdf8 28%, #0284c7 62%, #082f49 100%);
            box-shadow: 0 0 60px rgba(0, 242, 254, 0.75), 0 0 110px rgba(168, 85, 247, 0.35), inset 0 0 25px rgba(255, 255, 255, 0.75);
            transition: transform 0.06s ease-out, background 0.3s ease, box-shadow 0.3s ease;
            z-index: 5;
        }

        /* Orb States */
        .live-orb.state-listening {
            background: radial-gradient(circle at 32% 32%, #ecfdf5 0%, #34d399 30%, #059669 65%, #022c22 100%);
            box-shadow: 0 0 65px rgba(16, 185, 129, 0.8), 0 0 110px rgba(0, 242, 254, 0.35), inset 0 0 24px #ffffff;
        }
        .live-orb.state-thinking {
            background: radial-gradient(circle at 32% 32%, #fef3c7 0%, #fbbf24 32%, #d97706 68%, #451a03 100%);
            box-shadow: 0 0 70px rgba(251, 191, 36, 0.85), 0 0 120px rgba(245, 158, 11, 0.45), inset 0 0 24px #ffffff;
            animation: pulseThink 0.7s ease-in-out infinite alternate;
        }
        .live-orb.state-speaking {
            background: radial-gradient(circle at 32% 32%, #f3e8ff 0%, #c084fc 30%, #7e22ce 65%, #2e1065 100%);
            box-shadow: 0 0 80px rgba(168, 85, 247, 0.95), 0 0 135px rgba(0, 242, 254, 0.5), inset 0 0 28px #ffffff;
        }

        @keyframes pulseThink {
            from { transform: scale(0.92); }
            to { transform: scale(1.08); }
        }

        .call-state-pill {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2.5px;
            color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.35);
            padding: 7px 20px;
            border-radius: 999px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(0, 242, 254, 0.45);
        }

        .transcript-box {
            min-height: 84px;
            max-height: 150px;
            overflow-y: auto;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 16px 22px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.55);
        }

        .user-caption {
            font-size: 13px;
            color: #94a3b8;
            font-family: 'JetBrains Mono', monospace;
        }
        .kiza-caption {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.5;
        }

        .barge-in-hint {
            font-size: 11.5px;
            color: #94a3b8;
            font-family: 'JetBrains Mono', monospace;
        }

        /* BOTTOM CALL DOCK */
        .bottom-dock {
            width: 100%;
            max-width: 720px;
            padding: 16px 20px 26px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 20;
        }

        .quick-text-row {
            display: flex;
            width: 100%;
            gap: 8px;
        }
        .quick-text-row input {
            flex: 1;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: #ffffff;
            padding: 11px 16px;
            border-radius: 999px;
            font-size: 13px;
            outline: none;
        }
        .quick-text-row button {
            background: linear-gradient(135deg, #00f2fe 0%, #2563eb 100%);
            border: none;
            color: #030611;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 11px;
            padding: 0 20px;
            border-radius: 999px;
            cursor: pointer;
        }

        .call-controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .ctrl-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1.5px solid var(--glass-border);
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        .ctrl-btn:hover {
            transform: translateY(-2px) scale(1.05);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }
        .ctrl-btn.muted {
            background: rgba(244, 63, 94, 0.22);
            border-color: var(--danger);
            color: var(--danger);
        }

        .end-call-btn {
            height: 56px;
            padding: 0 28px;
            border-radius: 999px;
            background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
            border: none;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 25px rgba(244, 63, 94, 0.55);
            transition: all 0.2s ease;
        }
        .end-call-btn:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 12px 32px rgba(244, 63, 94, 0.8);
        }

        @media (max-width: 680px) {
            .pip-camera-card {
                width: 130px;
                height: 96px;
                top: 74px;
                right: 14px;
            }
            .orb-wrapper {
                width: 200px;
                height: 200px;
            }
            .live-orb { width: 98px; height: 98px; }
            .l-ring-1 { width: 140px; height: 140px; }
            .l-ring-2 { width: 170px; height: 170px; }
            .l-ring-3 { width: 196px; height: 196px; }
        }
    </style>
</head>
<body>

    <!-- TOP CALL BAR -->
    <div class="top-bar">
        <div class="call-badge">
            <span class="live-dot" id="connDot"></span>
            <span id="callHeaderTitle">KIZA LIVE CALL • 00:00</span>
        </div>

        <div class="top-right-controls">
            <select id="livePersonaSelect" class="persona-pill">
                <option value="normal">🟢 Normal (UK • Witty)</option>
                <option value="helpful">💼 Executive (IN • Polite)</option>
                <option value="energetic">⚡ Energetic (US • Fast)</option>
                <option value="security">🛡️ Security (Tactical)</option>
            </select>
        </div>
    </div>

    <!-- PICTURE-IN-PICTURE LIVE CAMERA VISION FEED -->
    <div class="pip-camera-card" id="pipCard">
        <video id="liveVideo" autoplay playsinline muted></video>
        <canvas id="captureCanvas" width="480" height="360" style="display:none;"></canvas>
        <div class="vision-scan-line" id="scanLine"></div>
        <div class="pip-label" id="camBadgeLabel">👁️ VISION ACTIVE</div>
    </div>

    <!-- CENTER STAGE: AUDIO-REACTIVE ORB & LIVE CAPTIONS -->
    <div class="center-stage">
        <div class="orb-wrapper" onclick="triggerManualBargeIn()" title="Tap Orb anytime to interrupt KIZA and speak immediately">
            <div class="live-ring l-ring-1"></div>
            <div class="live-ring l-ring-2"></div>
            <div class="live-ring l-ring-3"></div>
            <div id="liveOrb" class="live-orb state-listening"></div>
        </div>

        <div id="callStateBanner" class="call-state-pill">🟢 LISTENING TO YOU...</div>

        <div class="transcript-box">
            <div class="user-caption" id="userLiveCaption">🎤 Say anything or show an object to your camera...</div>
            <div class="kiza-caption" id="kizaLiveCaption">Connecting to KIZA Live Neural Core...</div>
        </div>

        <div class="barge-in-hint">
            💡 <b>Natural Turn-Taking Active:</b> Just start speaking (or tap the Orb) anytime to interrupt KIZA mid-sentence.
        </div>
    </div>

    <!-- BOTTOM CALL CONTROLS -->
    <div class="bottom-dock">
        <div class="quick-text-row">
            <input type="text" id="fallbackTextInput" placeholder="Or type a message during the call and press Enter...">
            <button type="button" onclick="sendTypedLiveMessage()">SEND</button>
        </div>

        <div class="call-controls-row">
            <button type="button" class="ctrl-btn" id="micMuteBtn" onclick="toggleMicMute()" title="Mute / Unmute Microphone">🎤</button>
            <button type="button" class="ctrl-btn" id="camMuteBtn" onclick="toggleCamStream()" title="Toggle Camera Vision">📷</button>
            <button type="button" class="ctrl-btn" id="flipCamBtn" onclick="flipLiveCamera()" title="Flip Front / Back Camera">🔄</button>
            <button type="button" class="ctrl-btn" id="bargeInBtn" onclick="triggerManualBargeIn()" title="Interrupt KIZA Speech Now">✋</button>
            <button type="button" class="end-call-btn" onclick="endLiveCall()">📞 END CALL</button>
        </div>
    </div>

    <script>
        const HTTP_SERVER = "https://kiza-brain.onrender.com";
        const WS_LIVE_URL = "wss://kiza-brain.onrender.com/api/live/call";

        const urlParams = new URLSearchParams(window.location.search);
        const currentUser = urlParams.get('user') || localStorage.getItem('kiza_user') || "Operative";
        const currentRole = urlParams.get('role') || localStorage.getItem('kiza_role') || "OPERATIVE";
        const initialPersona = urlParams.get('persona') || "normal";

        document.getElementById('livePersonaSelect').value = initialPersona;

        let liveWs = null;
        let wsReady = false;
        let callSeconds = 0;

        let mediaStream = null;
        let videoDevices = [];
        let currentCamIdx = 0;
        let isCamOn = true;
        let isMicMuted = false;

        let recognition = null;
        let isKizaSpeaking = false;
        let isKizaThinking = false;
        let kizaAudio = null;

        let audioCtx = null;
        let kizaAnalyserFrame = null;
        let micVadContext = null;
        let micVadAnalyser = null;
        let bargeInSpeechStreak = 0;

        let latestFrameBase64 = null;
        let liveSessionId = "live_call_" + Date.now();

        const PERSONA_RATES = {
            normal: 1.05,
            helpful: 1.06,
            energetic: 1.16,
            security: 0.96
        };

        // Call Duration Timer
        setInterval(() => {
            callSeconds++;
            const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
            const secs = String(callSeconds % 60).padStart(2, '0');
            const cleanName = currentUser.replace(/\s*\((owner|admin|mod|moderator|you)\)/gi, '').trim().toUpperCase();
            document.getElementById('callHeaderTitle').innerText = `KIZA LIVE • ${cleanName} • ${mins}:${secs}`;
        }, 1000);

        // ==========================================================
        // 1. CAMERA & CONTINUOUS VISION FRAME SAMPLER
        // ==========================================================
        async function initLiveCamera() {
            try {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(t => t.stop());
                }
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                const videoEl = document.getElementById('liveVideo');
                videoEl.srcObject = mediaStream;
                videoDevices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
                document.getElementById('camBadgeLabel').innerText = "👁️ VISION ACTIVE";
                document.getElementById('scanLine').style.display = "block";
            } catch (e) {
                isCamOn = false;
                document.getElementById('camBadgeLabel').innerText = "📷 CAM OFFLINE";
                document.getElementById('scanLine').style.display = "none";
            }
        }

        function captureCurrentVideoFrame() {
            if (!isCamOn || !mediaStream) return null;
            try {
                const videoEl = document.getElementById('liveVideo');
                if (!videoEl.videoWidth) return null;
                const canvas = document.getElementById('captureCanvas');
                canvas.width = 480;
                canvas.height = 360;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                latestFrameBase64 = canvas.toDataURL('image/jpeg', 0.65);
                return latestFrameBase64;
            } catch (e) {
                return null;
            }
        }

        // Stream continuous background vision frame every 2.5 seconds
        setInterval(() => {
            if (!isCamOn) return;
            const frame = captureCurrentVideoFrame();
            if (frame && wsReady && liveWs && liveWs.readyState === WebSocket.OPEN) {
                liveWs.send(JSON.stringify({ type: "frame", image_base64: frame }));
            }
        }, 2500);

        async function flipLiveCamera() {
            if (videoDevices.length <= 1) return;
            currentCamIdx = (currentCamIdx + 1) % videoDevices.length;
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            mediaStream = await navigator.mediaDevices.getUserMedia({
                video: { deviceId: { exact: videoDevices[currentCamIdx].deviceId } }
            });
            document.getElementById('liveVideo').srcObject = mediaStream;
            document.getElementById('pipCard').classList.toggle('rear-lens', currentCamIdx % 2 === 1);
        }

        function toggleCamStream() {
            isCamOn = !isCamOn;
            const btn = document.getElementById('camMuteBtn');
            if (isCamOn) {
                btn.classList.remove('muted');
                initLiveCamera();
            } else {
                btn.classList.add('muted');
                if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
                document.getElementById('liveVideo').srcObject = null;
                document.getElementById('camBadgeLabel').innerText = "📷 CAM MUTED";
                document.getElementById('scanLine').style.display = "none";
                latestFrameBase64 = null;
            }
        }

        // ==========================================================
        // 2. VOICE INTERRUPTION & BARGE-IN ENGINE (NATURAL TURN-TAKING)
        // ==========================================================
        async function initMicrophoneBargeInDetector() {
            try {
                const micStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });
                micVadContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = micVadContext.createMediaStreamSource(micStream);
                micVadAnalyser = micVadContext.createAnalyser();
                micVadAnalyser.fftSize = 256;
                source.connect(micVadAnalyser);
                const data = new Uint8Array(micVadAnalyser.frequencyBinCount);

                function monitorMicVolume() {
                    requestAnimationFrame(monitorMicVolume);
                    if (isMicMuted) return;

                    micVadAnalyser.getByteFrequencyData(data);
                    let sum = 0;
                    for (let i = 2; i < 40; i++) sum += data[i];
                    const avgVoiceBand = sum / 38;

                    // Pulse orb gently to user's own voice when listening
                    if (!isKizaSpeaking && !isKizaThinking) {
                        const orb = document.getElementById('liveOrb');
                        const scale = 1 + Math.min(0.25, (avgVoiceBand / 255) * 0.32);
                        orb.style.transform = `scale(${scale.toFixed(3)})`;
                    }
                }
                monitorMicVolume();
            } catch (e) {}
        }

        function triggerManualBargeIn() {
            if (isKizaSpeaking || isKizaThinking) {
                executeInstantBargeIn("Interrupted by user");
            }
        }

        function executeInstantBargeIn(reason = "Voice barge-in") {
            if (kizaAudio) {
                try {
                    kizaAudio.pause();
                    kizaAudio.currentTime = 0;
                } catch (e) {}
                kizaAudio = null;
            }
            if (kizaAnalyserFrame) cancelAnimationFrame(kizaAnalyserFrame);
            isKizaSpeaking = false;
            isKizaThinking = false;

            if (wsReady && liveWs && liveWs.readyState === WebSocket.OPEN) {
                try {
                    liveWs.send(JSON.stringify({ type: "interrupt" }));
                } catch (e) {}
            }
            setOrbState("listening", "🟢 LISTENING (INTERRUPTED)...");
        }

        // ==========================================================
        // 3. CONTINUOUS SPEECH RECOGNITION WITH BARGE-IN HOOKS
        // ==========================================================
        function initContinuousSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                document.getElementById('userLiveCaption').innerText = "⚠️ Browser speech recognition unavailable. Use the text box below.";
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                if (isMicMuted) return;

                let interimTranscript = "";
                let finalTranscript = "";

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const txt = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += txt;
                    } else {
                        interimTranscript += txt;
                    }
                }

                // Instant Barge-In: If user starts speaking while KIZA is talking, cut KIZA off immediately!
                if (interimTranscript.trim().length > 2 && (isKizaSpeaking || isKizaThinking)) {
                    executeInstantBargeIn("User started speaking");
                }

                if (interimTranscript.trim()) {
                    document.getElementById('userLiveCaption').innerText = `🗣️ "${interimTranscript.trim()}..."`;
                }

                if (finalTranscript.trim()) {
                    const cleanSpeech = finalTranscript.trim();
                    document.getElementById('userLiveCaption').innerText = `🗣️ You: "${cleanSpeech}"`;
                    dispatchUserSpeechToKiza(cleanSpeech);
                }
            };

            recognition.onerror = () => {};
            recognition.onend = () => {
                if (!isMicMuted) {
                    setTimeout(() => {
                        try { recognition.start(); } catch (e) {}
                    }, 250);
                }
            };

            try { recognition.start(); } catch (e) {}
        }

        function toggleMicMute() {
            isMicMuted = !isMicMuted;
            const btn = document.getElementById('micMuteBtn');
            if (isMicMuted) {
                btn.classList.add('muted');
                btn.innerText = "🔇";
                setOrbState("listening", "🔇 MICROPHONE MUTED");
                if (recognition) { try { recognition.stop(); } catch (e) {} }
            } else {
                btn.classList.remove('muted');
                btn.innerText = "🎤";
                setOrbState("listening", "🟢 LISTENING TO YOU...");
                if (recognition) { try { recognition.start(); } catch (e) {} }
            }
        }

        // ==========================================================
        // 4. WEBSOCKET + AUTOMATIC HTTP FALLBACK ENGINE
        // ==========================================================
        function connectLiveWebSocket() {
            const persona = document.getElementById('livePersonaSelect').value || "normal";
            try {
                liveWs = new WebSocket(`${WS_LIVE_URL}?user=${encodeURIComponent(currentUser)}&personality=${encodeURIComponent(persona)}`);

                liveWs.onopen = () => {
                    wsReady = true;
                    document.getElementById('connDot').style.background = "#10b981";
                    setOrbState("listening", "🟢 LIVE LINK ESTABLISHED");
                };

                liveWs.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === "state" && data.status === "thinking") {
                            isKizaThinking = true;
                            setOrbState("thinking", "⚡ KIZA THINKING...");
                        } else if (data.type === "interrupted") {
                            isKizaThinking = false;
                            isKizaSpeaking = false;
                            setOrbState("listening", "🟢 LISTENING TO YOU...");
                        } else if (data.type === "response") {
                            isKizaThinking = false;
                            handleKizaLiveReply(data.text, data.audio_base64);
                        }
                    } catch (e) {}
                };

                liveWs.onclose = () => {
                    wsReady = false;
                    document.getElementById('connDot').style.background = "#fbbf24";
                };

                liveWs.onerror = () => {
                    wsReady = false;
                };
            } catch (e) {
                wsReady = false;
            }
        }

        async function dispatchUserSpeechToKiza(speechText) {
            if (!speechText) return;
            executeInstantBargeIn();

            isKizaThinking = true;
            setOrbState("thinking", "⚡ KIZA THINKING...");
            const persona = document.getElementById('livePersonaSelect').value || "normal";
            const snap = captureCurrentVideoFrame();

            if (wsReady && liveWs && liveWs.readyState === WebSocket.OPEN) {
                liveWs.send(JSON.stringify({
                    type: "speech",
                    text: speechText,
                    personality: persona,
                    image_base64: snap
                }));
                return;
            }

            // Seamless HTTP Fallback if Render WebSocket hasn't finished deploying yet
            try {
                const res = await fetch(`${HTTP_SERVER}/api/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        user: currentUser,
                        command: speechText,
                        image_base64: snap,
                        is_attached_image: Boolean(snap),
                        personality: persona,
                        session_id: liveSessionId
                    })
                });
                const data = await res.json();
                isKizaThinking = false;
                handleKizaLiveReply(data.reply || "I'm here and listening.", data.audio_base64);
            } catch (err) {
                isKizaThinking = false;
                document.getElementById('kizaLiveCaption').innerText = "Connection interrupted. Retrying link...";
                setOrbState("listening", "🟢 LISTENING TO YOU...");
            }
        }

        function sendTypedLiveMessage() {
            const inp = document.getElementById('fallbackTextInput');
            const val = inp.value.trim();
            if (!val) return;
            inp.value = "";
            document.getElementById('userLiveCaption').innerText = `⌨️ You: "${val}"`;
            dispatchUserSpeechToKiza(val);
        }

        document.getElementById('fallbackTextInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendTypedLiveMessage();
        });

        function handleKizaLiveReply(replyText, audioBase64) {
            const cleanText = String(replyText || "")
                .replace(/<think>[\s\S]*?<\/think>/gi, '')
                .replace(/\[GENERATE_FILE:[^\]]+\]/g, '')
                .replace(/\[ACTION:[^\]]+\]/g, '')
                .replace(/\*/g, '')
                .trim();

            document.getElementById('kizaLiveCaption').innerText = cleanText || "I'm listening.";

            if (audioBase64) {
                playLiveKizaVoice(audioBase64);
            } else {
                setOrbState("listening", "🟢 LISTENING TO YOU...");
            }
        }

        function playLiveKizaVoice(base64Audio) {
            if (kizaAudio) {
                try { kizaAudio.pause(); } catch (e) {}
                kizaAudio = null;
            }
            if (kizaAnalyserFrame) cancelAnimationFrame(kizaAnalyserFrame);

            isKizaSpeaking = true;
            setOrbState("speaking", "🔊 KIZA SPEAKING (SPEAK TO INTERRUPT)");

            kizaAudio = new Audio("data:audio/mp3;base64," + base64Audio);
            const persona = document.getElementById('livePersonaSelect').value || "normal";
            kizaAudio.playbackRate = PERSONA_RATES[persona] || 1.05;

            const orb = document.getElementById('liveOrb');

            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const src = audioCtx.createMediaElementSource(kizaAudio);
                const analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64;
                src.connect(analyser);
                analyser.connect(audioCtx.destination);
                const freqData = new Uint8Array(analyser.frequencyBinCount);

                function animateKizaOrb() {
                    if (!isKizaSpeaking) {
                        orb.style.transform = "";
                        return;
                    }
                    analyser.getByteFrequencyData(freqData);
                    let sum = 0;
                    for (let i = 0; i < freqData.length; i++) sum += freqData[i];
                    const avg = sum / freqData.length;
                    const scale = 1 + (avg / 255) * 0.36;
                    orb.style.transform = `scale(${scale.toFixed(3)})`;
                    kizaAnalyserFrame = requestAnimationFrame(animateKizaOrb);
                }
                animateKizaOrb();
            } catch (e) {}

            kizaAudio.onended = () => {
                isKizaSpeaking = false;
                orb.style.transform = "";
                setOrbState("listening", "🟢 LISTENING TO YOU...");
            };
            kizaAudio.onerror = () => {
                isKizaSpeaking = false;
                orb.style.transform = "";
                setOrbState("listening", "🟢 LISTENING TO YOU...");
            };
            kizaAudio.play().catch(() => {
                isKizaSpeaking = false;
                orb.style.transform = "";
                setOrbState("listening", "🟢 LISTENING TO YOU...");
            });
        }

        function setOrbState(mode, bannerText) {
            const orb = document.getElementById('liveOrb');
            const banner = document.getElementById('callStateBanner');
            orb.classList.remove('state-listening', 'state-thinking', 'state-speaking');
            orb.classList.add(`state-${mode}`);
            if (bannerText) banner.innerText = bannerText;
        }

        function endLiveCall() {
            executeInstantBargeIn();
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            if (liveWs) { try { liveWs.close(); } catch (e) {} }
            window.location.href = "index.html";
        }

        window.addEventListener('DOMContentLoaded', () => {
            initLiveCamera();
            initMicrophoneBargeInDetector();
            initContinuousSpeechRecognition();
            connectLiveWebSocket();
        });
    </script>
</body>
