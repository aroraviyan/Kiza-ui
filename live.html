<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#050a14">
    <title>KIZA Live — Hands-Free VAD, Vision & Shared Whiteboard</title>
    <link rel="icon" type="image/png" href="logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-deep: #040814;
            --glass: rgba(15, 23, 42, 0.80);
            --glass-border: rgba(56, 189, 248, 0.25);
            --accent: #38bdf8;
            --glow: #00f2fe;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            position: fixed; inset: 0; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: 'Inter', -apple-system, sans-serif;
            background: radial-gradient(circle at 20% 15%, rgba(0, 242, 254, 0.12) 0%, transparent 42%),
                        radial-gradient(circle at 80% 85%, rgba(99, 102, 241, 0.16) 0%, transparent 45%),
                        var(--bg-deep);
            color: var(--text);
        }

        .live-shell {
            display: flex; flex-direction: column; width: 100%; height: 100%;
            padding: max(8px, env(safe-area-inset-top, 8px)) 12px max(14px, env(safe-area-inset-bottom, 14px)) 12px;
            gap: 8px; position: relative; overflow: hidden;
        }

        /* TOP HUD */
        .top-hud { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; flex-shrink: 0; z-index: 20; }
        .hud-pill {
            display: inline-flex; align-items: center; gap: 7px;
            background: var(--glass); backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border); border-radius: 999px;
            padding: 5px 12px; font-size: 11px; font-weight: 700;
        }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); box-shadow: 0 0 10px var(--warning); }
        .live-dot.online { background: var(--success); box-shadow: 0 0 10px var(--success); animation: pulseDot 1.6s infinite; }
        @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
        .lang-select-pill { background: transparent; border: none; color: var(--accent); font-weight: 800; font-size: 11px; outline: none; cursor: pointer; }
        .lang-select-pill option { background: #0f172a; color: #f8fafc; }

        /* VAD AUDIO METER BAR */
        .vad-meter-wrap { display: inline-flex; align-items: center; gap: 3px; height: 14px; }
        .vad-bar { width: 3px; height: 4px; background: var(--success); border-radius: 2px; transition: height 0.08s ease; }

        /* MAIN CENTRAL STAGE */
        .stage-area {
            flex: 1 1 0%; min-height: 0; position: relative;
            display: flex; align-items: center; justify-content: center;
            border-radius: 18px; overflow: hidden;
        }

        /* ORB AMBIENT STAGE */
        .orb-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; width: 100%; max-width: 680px; padding: 12px; text-align: center; }
        .orb-stage.compact-mode { display: none; }
        .orb-ring-outer { position: relative; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; }
        .orb-ring-outer::before, .orb-ring-outer::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(0, 242, 254, 0.35); animation: spinRing 9s linear infinite; }
        .orb-ring-outer::after { inset: 10px; border-color: rgba(129, 140, 248, 0.45); border-style: dashed; animation-direction: reverse; animation-duration: 14s; }
        @keyframes spinRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .orb-core {
            width: 98px; height: 98px; border-radius: 50%; overflow: hidden;
            border: 2.5px solid var(--glow); box-shadow: 0 0 34px rgba(0, 242, 254, 0.55);
            background: #071324; transition: transform 0.14s ease, box-shadow 0.2s ease;
        }
        .orb-core.speaking { transform: scale(1.09); box-shadow: 0 0 55px rgba(0, 242, 254, 0.9); }
        .orb-core.listening { border-color: var(--success); box-shadow: 0 0 46px rgba(16, 185, 129, 0.78); }
        .orb-core.thinking { border-color: var(--warning); box-shadow: 0 0 42px rgba(245, 158, 11, 0.75); }
        .orb-core img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .status-chip { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: var(--accent); background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.35); padding: 5px 14px; border-radius: 999px; }

        /* SHARED WHITEBOARD STAGE */
        .whiteboard-stage {
            display: none; flex-direction: column; width: 100%; height: 100%;
            background: #0b1120; border: 1.5px solid var(--glass-border); border-radius: 18px; overflow: hidden;
        }
        .whiteboard-stage.active { display: flex; }
        .wb-toolbar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 6px; padding: 7px 11px; background: rgba(15, 23, 42, 0.96);
            border-bottom: 1px solid rgba(148, 163, 184, 0.2); flex-wrap: wrap; flex-shrink: 0; z-index: 15;
            position: relative;
        }
        .wb-tools-group { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
        .color-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-dot.active { border-color: #ffffff; transform: scale(1.15); }
        .wb-btn { background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(148, 163, 184, 0.3); color: var(--text); font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 999px; cursor: pointer; }
        .wb-btn:hover, .wb-btn.active { border-color: var(--accent); color: var(--accent); }

        .wb-save-menu {
            display: none; position: absolute; top: 44px; right: 70px; z-index: 50;
            background: #0f172a; border: 1.5px solid var(--accent); border-radius: 14px;
            padding: 7px; flex-direction: column; gap: 5px; min-width: 175px;
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.65);
        }
        .wb-save-menu.open { display: flex; }

        .wb-canvas-wrap {
            flex: 1 1 0%; position: relative; background: #090f1d;
            background-image: radial-gradient(rgba(148, 163, 184, 0.22) 1.2px, transparent 1.2px);
            background-size: 22px 22px; overflow: hidden; touch-action: none;
        }
        #sharedWhiteboard { width: 100%; height: 100%; display: block; cursor: crosshair; background: transparent; }

        /* SCREEN SHARE & PHOTO STAGES */
        .screen-stage { display: none; flex-direction: column; width: 100%; height: 100%; background: #020617; border: 1.5px solid rgba(16, 185, 129, 0.45); border-radius: 18px; overflow: hidden; position: relative; }
        .screen-stage.active { display: flex; }
        #screenVideo { width: 100%; height: 100%; object-fit: contain; background: #000; }
        .stage-badge { position: absolute; top: 10px; left: 12px; z-index: 10; background: rgba(2, 6, 23, 0.85); border: 1px solid rgba(16, 185, 129, 0.5); color: #34d399; padding: 4px 11px; border-radius: 999px; font-size: 11px; font-weight: 700; }

        .photo-stage { display: none; align-items: center; justify-content: center; width: 100%; height: 100%; background: rgba(2, 6, 23, 0.92); border: 1.5px solid var(--glass-border); border-radius: 18px; position: relative; padding: 14px; }
        .photo-stage.active { display: flex; }
        #uploadedPhotoPreview { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; }

        /* DRAGGABLE CAMERA PiP */
        .camera-pip {
            position: absolute; bottom: 12px; right: 12px; z-index: 40;
            width: 164px; height: 114px; border-radius: 14px; overflow: hidden;
            background: #0f172a; border: 2px solid rgba(56, 189, 248, 0.65);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65);
            display: flex; align-items: center; justify-content: center;
            cursor: grab; touch-action: none; user-select: none;
        }
        .camera-pip.dragging { cursor: grabbing; border-color: var(--glow); box-shadow: 0 0 24px rgba(0, 242, 254, 0.6); }
        .camera-pip video { width: 100%; height: 100%; object-fit: cover; display: none; pointer-events: none; }
        .cam-pip-label { position: absolute; bottom: 5px; left: 6px; font-size: 9px; font-weight: 800; background: rgba(2, 6, 23, 0.78); color: var(--accent); padding: 2px 7px; border-radius: 99px; pointer-events: none; }
        .cam-pip-flip { position: absolute; top: 5px; right: 5px; width: 24px; height: 24px; border-radius: 50%; border: none; background: rgba(2, 6, 23, 0.8); color: #fff; font-size: 11px; cursor: pointer; z-index: 5; }

        /* LIVE CAPTION BAR */
        .caption-card {
            width: 100%; max-width: 820px; margin: 0 auto; flex-shrink: 0;
            background: var(--glass); backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border); border-radius: 14px;
            padding: 7px 14px; text-align: center; font-size: 13px;
            line-height: 1.42; min-height: 36px; max-height: 78px; overflow-y: auto;
        }

        /* COMPACT NON-CLIPPING BOTTOM DOCK */
        .bottom-dock { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; max-width: 820px; margin: 0 auto; flex-shrink: 0; padding-bottom: 2px; z-index: 25; }
        .text-bar { display: flex; gap: 7px; width: 100%; background: var(--glass); border: 1px solid var(--glass-border); padding: 4px 6px 4px 13px; border-radius: 999px; }
        .text-bar input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 13px; font-family: inherit; }
        .send-pill { background: linear-gradient(135deg, #00f2fe 0%, #0284c7 100%); color: #041020; border: none; padding: 6px 15px; border-radius: 999px; font-weight: 800; font-size: 12px; cursor: pointer; }

        .controls-row { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
        .controls-row::-webkit-scrollbar { display: none; }
        .ctrl-btn {
            height: 35px; padding: 0 12px; border-radius: 999px; flex-shrink: 0;
            background: var(--glass); border: 1px solid var(--glass-border); color: var(--text);
            font-size: 11.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .ctrl-btn:hover { border-color: var(--accent); }
        .ctrl-btn.active { background: rgba(56, 189, 248, 0.22); border-color: var(--glow); color: var(--glow); }
        .ctrl-btn.vad-on { background: linear-gradient(135deg, #10b981 0%, #059669 100%); border: none; color: #ffffff; box-shadow: 0 0 16px rgba(16, 185, 129, 0.5); }
        .ctrl-btn.ptt-btn { background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%); border: none; color: #0f172a; font-weight: 800; padding: 0 14px; user-select: none; }
        .ctrl-btn.ptt-btn.listening { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #ffffff; }
        .ctrl-btn.end-btn { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); border: none; color: #ffffff; padding: 0 15px; }

        @media (max-width: 640px) {
            .camera-pip { width: 116px; height: 84px; }
            .controls-row { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <div class="live-shell">
        <div class="top-hud">
            <div class="hud-pill">
                <span class="live-dot" id="connDot"></span>
                <span>KIZA LIVE</span>
                <span style="color:var(--muted);">•</span>
                <span id="liveUserLabel">USER</span>
                <span style="color:var(--muted);">•</span>
                <span id="callTimer" style="font-family:'JetBrains Mono', monospace; color:var(--accent);">00:00</span>
            </div>
            <div class="hud-pill">
                <span class="vad-meter-wrap" id="vadMeter" style="display:none;" title="Live Mic VAD Level">
                    <span class="vad-bar" id="vb1"></span>
                    <span class="vad-bar" id="vb2"></span>
                    <span class="vad-bar" id="vb3"></span>
                </span>
                <span id="activeVisionBadge" style="color:var(--success);">👁️ Camera Ready</span>
                <span style="color:var(--muted);">|</span>
                <select id="speechLangSelect" class="lang-select-pill" title="Voice Input Language">
                    <option value="en-IN" selected>🇮🇳 EN / HI / PA</option>
                    <option value="hi-IN">🇮🇳 Hindi</option>
                    <option value="pa-IN">🇮🇳 Punjabi</option>
                    <option value="en-US">🇺🇸 English</option>
                </select>
                <span style="color:var(--muted);">|</span>
                <span id="livePing" style="font-family:'JetBrains Mono', monospace; color:var(--warning);">Connecting...</span>
            </div>
        </div>

        <div class="stage-area" id="stageContainer">
            <!-- DRAGGABLE INDEPENDENT CAMERA PiP -->
            <div class="camera-pip" id="cameraPipBox" title="Drag anywhere to move">
                <video id="camVideo" autoplay playsinline muted></video>
                <span id="camOfflineText" style="font-size:10px; color:var(--muted); pointer-events:none;">📷 Cam Off</span>
                <span class="cam-pip-label">⠿ CAM LIVE</span>
                <button type="button" class="cam-pip-flip" id="camFlipBtn" title="Flip Camera">🔄</button>
            </div>

            <!-- 1. AMBIENT ORB STAGE -->
            <div class="orb-stage" id="orbStage">
                <div class="orb-ring-outer">
                    <div class="orb-core" id="liveOrb">
                        <img src="logo.jpg" alt="KIZA" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 120%22><circle cx=%2260%22 cy=%2260%22 r=%2256%22 fill=%22%23071324%22 stroke=%22%2300f2fe%22 stroke-width=%224%22/><text x=%2260%22 y=%2270%22 font-family=%22Arial%22 font-weight=%22900%22 font-size=%2226%22 text-anchor=%22middle%22 fill=%22%2300f2fe%22>KIZA</text></svg>';">
                    </div>
                </div>
                <div class="status-chip" id="liveStatusChip">CONNECTING TO KIZA BRAIN...</div>
            </div>

            <!-- 2. SHARED AI WHITEBOARD WITH TRANSPARENT ERASER & 1-TAP SAVE -->
            <div class="whiteboard-stage" id="whiteboardStage">
                <div class="wb-toolbar">
                    <div class="wb-tools-group">
                        <span style="font-size:11.5px; font-weight:800; color:var(--glow);">🎨 Shared AI Whiteboard</span>
                        <div class="color-dot active" style="background:#38bdf8;" onclick="setWbColor('#38bdf8', this)"></div>
                        <div class="color-dot" style="background:#fbbf24;" onclick="setWbColor('#fbbf24', this)"></div>
                        <div class="color-dot" style="background:#f87171;" onclick="setWbColor('#f87171', this)"></div>
                        <div class="color-dot" style="background:#34d399;" onclick="setWbColor('#34d399', this)"></div>
                        <div class="color-dot" style="background:#ffffff;" onclick="setWbColor('#ffffff', this)"></div>
                        <input type="range" id="wbSizeSlider" min="2" max="14" value="4" style="width:60px;">
                    </div>
                    <div class="wb-tools-group">
                        <button type="button" class="wb-btn" id="wbEraserBtn" onclick="toggleWbEraser()">🧹 Eraser</button>
                        <button type="button" class="wb-btn" onclick="undoWbStroke()">↩️ Undo</button>
                        <button type="button" class="wb-btn" onclick="clearWhiteboard()">🗑️ Clear</button>
                        <button type="button" class="wb-btn" style="border-color:var(--accent); color:var(--accent);" onclick="toggleWbSaveMenu(event)">💾 Save Board</button>
                        <button type="button" class="wb-btn" style="border-color:var(--success); color:var(--success);" onclick="askKizaAboutWhiteboard()">✨ Ask KIZA</button>
                        <button type="button" class="wb-btn" onclick="setStageMode('orb')">✕ Hide</button>
                    </div>
                    <div id="wbSaveMenu" class="wb-save-menu">
                        <button type="button" class="wb-btn" style="text-align:left;" onclick="exportWhiteboardPNG()">🖼️ Download PNG</button>
                        <button type="button" class="wb-btn" style="text-align:left;" onclick="exportWhiteboardPDF()">📕 Download Study PDF</button>
                        <button type="button" class="wb-btn" style="text-align:left; border-color:var(--success); color:var(--success);" onclick="sendWhiteboardToMainChat()">💬 Save to Main Chat</button>
                    </div>
                </div>
                <div class="wb-canvas-wrap" id="wbCanvasWrap">
                    <canvas id="sharedWhiteboard"></canvas>
                </div>
            </div>

            <!-- 3. HD SCREEN SHARE STAGE -->
            <div class="screen-stage" id="screenStage">
                <span class="stage-badge">🖥️ HD SCREEN SHARE • CAM STILL LIVE</span>
                <video id="screenVideo" autoplay playsinline muted></video>
            </div>

            <!-- 4. HD PHOTO UPLOAD STAGE -->
            <div class="photo-stage" id="photoStage">
                <span class="stage-badge" style="color:var(--accent); border-color:var(--accent);">📸 HD PHOTO ATTACHED</span>
                <button type="button" class="wb-btn" style="position:absolute; top:10px; right:12px; z-index:12; border-color:var(--danger); color:var(--danger);" onclick="clearUploadedPhoto()">✕ Remove</button>
                <img id="uploadedPhotoPreview" alt="Uploaded Photo">
            </div>
        </div>

        <div class="caption-card" id="captionBox">Connecting securely to KIZA Live...</div>

        <div class="bottom-dock">
            <div class="text-bar">
                <input type="text" id="liveTextInput" placeholder="Ask KIZA anything or say 'Draw a right triangle and label it'..." autocomplete="off">
                <button type="button" class="send-pill" onclick="sendTypedLiveMessage()">Send</button>
            </div>
            <div class="controls-row">
                <input type="file" id="livePhotoInput" accept="image/*" style="display:none;" onchange="handleLivePhotoUpload(event)">
                <button type="button" class="ctrl-btn" id="vadToggleBtn" onclick="toggleHandsFreeVAD()" title="Auto-listen & interrupt KIZA by speaking">🟢 Hands-Free: Off</button>
                <button type="button" class="ctrl-btn ptt-btn" id="pttBtn">🎙️ Hold</button>
                <button type="button" class="ctrl-btn" id="camBtn" onclick="toggleCameraFeed()">📷 Cam: On</button>
                <button type="button" class="ctrl-btn" id="wbToggleBtn" onclick="toggleWhiteboardMode()">🎨 Board</button>
                <button type="button" class="ctrl-btn" id="screenBtn" onclick="toggleScreenShare()">🖥️ Screen</button>
                <button type="button" class="ctrl-btn" onclick="document.getElementById('livePhotoInput').click()">📸 Photo</button>
                <button type="button" class="ctrl-btn" id="muteBtn" onclick="toggleSpeakerMute()">🔊 Sound</button>
                <button type="button" class="ctrl-btn end-btn" onclick="endLiveCall()">📞 End</button>
            </div>
        </div>
    </div>

    <canvas id="captureCanvas" style="display:none;"></canvas>

    <script>
        const SERVER_HTTP = "https://kiza-brain.onrender.com";
        const WS_LIVE_URL = "wss://kiza-brain.onrender.com/api/live/call";
        const params = new URLSearchParams(window.location.search);
        const userName = params.get("user") || localStorage.getItem("kiza_user") || "Guest";
        const personality = params.get("persona") || "helpful";
        const sessionToken = localStorage.getItem("kiza_sig") || "";

        document.getElementById("liveUserLabel").textContent = userName.toUpperCase();
        fetch(`${SERVER_HTTP}/health`).catch(() => {});

        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        const callStartTs = Date.now();
        const callTopics = [], callDecisions = [];
        let camStream = null, screenStream = null, camEnabled = true, facingMode = "user";
        let uploadedPhotoDataUrl = null, currentStageMode = "orb", speakerMuted = false;
        let activeAudio = null, isKizaSpeaking = false, lastKizaReplyText = "";
        let ws = null, wsReady = false, useHttpFallback = false, wsWatchdog = null;
        let pingStart = 0, pingInterval = null, ackTimeout = null, replyTimeout = null;

        setInterval(() => {
            const sec = Math.floor((Date.now() - callStartTs) / 1000);
            document.getElementById("callTimer").textContent = `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`;
        }, 1000);

        document.addEventListener("click", (e) => {
            const m = document.getElementById("wbSaveMenu");
            if (m && m.classList.contains("open") && !e.target.closest("#wbSaveMenu") && !e.target.closest("[onclick*='toggleWbSaveMenu']")) {
                m.classList.remove("open");
            }
        });

        // ==========================================================
        // 1. DRAGGABLE CAMERA PiP (MOUSE & TOUCH POINTER EVENTS)
        // ==========================================================
        (function initDraggableCameraPip() {
            const pip = document.getElementById("cameraPipBox");
            const stage = document.getElementById("stageContainer");
            const flipBtn = document.getElementById("camFlipBtn");
            let dragging = false, offsetX = 0, offsetY = 0;

            flipBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
            flipBtn.addEventListener("click", (e) => { e.stopPropagation(); flipCamera(); });

            pip.addEventListener("pointerdown", (e) => {
                if (e.target === flipBtn) return;
                dragging = true;
                pip.classList.add("dragging");
                pip.setPointerCapture(e.pointerId);
                const pr = pip.getBoundingClientRect();
                offsetX = e.clientX - pr.left;
                offsetY = e.clientY - pr.top;
            });
            pip.addEventListener("pointermove", (e) => {
                if (!dragging) return;
                const sr = stage.getBoundingClientRect();
                const newL = Math.min(Math.max(0, sr.width - pip.offsetWidth - 8), Math.max(8, e.clientX - sr.left - offsetX));
                const newT = Math.min(Math.max(0, sr.height - pip.offsetHeight - 8), Math.max(8, e.clientY - sr.top - offsetY));
                pip.style.right = "auto"; pip.style.bottom = "auto";
                pip.style.left = `${newL}px`; pip.style.top = `${newT}px`;
            });
            const endDrag = (e) => {
                if (!dragging) return;
                dragging = false; pip.classList.remove("dragging");
                try { pip.releasePointerCapture(e.pointerId); } catch (err) {}
            };
            pip.addEventListener("pointerup", endDrag);
            pip.addEventListener("pointercancel", endDrag);
        })();

        // ==========================================================
        // 2. DUAL CAMERA + SCREEN SHARE + SMART ZERO-LAG CAPTURE
        // ==========================================================
        function setStageMode(mode) {
            currentStageMode = mode;
            document.getElementById("orbStage").classList.toggle("compact-mode", mode !== "orb");
            document.getElementById("whiteboardStage").classList.toggle("active", mode === "whiteboard");
            document.getElementById("screenStage").classList.toggle("active", mode === "screen");
            document.getElementById("photoStage").classList.toggle("active", mode === "photo");
            document.getElementById("wbToggleBtn").classList.toggle("active", mode === "whiteboard");
            document.getElementById("screenBtn").classList.toggle("active", Boolean(screenStream));
            if (mode === "whiteboard") requestAnimationFrame(resizeWhiteboardCanvas);
            updateVisionBadge();

                    ctx.drawImage(sv, 0, 0, c.width, c.height);

        function wbStart(e) { e.preventDefault(); saveWbSnapshot(); wbDrawing = true; wbLastPos = getWbPos(e); }
        function wbMove(e) {
            if (!wbDrawing || !wbLastPos) return;
            e.preventDefault();
            const p = getWbPos(e);
            wbCtx.save();
            wbCtx.globalCompositeOperation = wbEraser ? "destination-out" : "source-over";
            wbCtx.lineCap = "round";
            wbCtx.lineJoin = "round";
            wbCtx.lineWidth = wbEraser ? 24 : Number(document.getElementById("wbSizeSlider").value || 4);
            wbCtx.strokeStyle = wbEraser ? "rgba(0,0,0,1)" : wbColor;
            wbCtx.beginPath();
            wbCtx.moveTo(wbLastPos.x, wbLastPos.y);
            wbCtx.lineTo(p.x, p.y);
            wbCtx.stroke();
            wbCtx.restore();
            wbLastPos = p;
        }

        function extractNormPoints(pts) {
            if (!Array.isArray(pts)) return [];
            return pts.map(pt => {
                if (Array.isArray(pt) && pt.length >= 2) return [Number(pt[0]), Number(pt[1])];
                if (pt && typeof pt === "object" && pt.x !== undefined && pt.y !== undefined) return [Number(pt.x), Number(pt.y)];
                return null;
            }).filter(p => p && !isNaN(p[0]) && !isNaN(p[1]));
        }

        async function executeKizaWhiteboardCommands(commands) {
            if (!Array.isArray(commands) || !commands.length) return;
            if (currentStageMode !== "whiteboard") {
                setStageMode("whiteboard");
                await new Promise(r => setTimeout(r, 150));
                resizeWhiteboardCanvas();
            }
            const W = wbCanvas.width || 800, H = wbCanvas.height || 450;

            let maxCoord = 0;
            commands.forEach(c => {
                ["x", "y", "x1", "y1", "x2", "y2", "x3", "y3", "cx", "cy", "w", "h"].forEach(k => {
                    const v = Number(c[k]);
                    if (!isNaN(v) && v > maxCoord) maxCoord = v;
                });
                extractNormPoints(c.points).forEach(([px, py]) => {
                    if (px > maxCoord) maxCoord = px;
                    if (py > maxCoord) maxCoord = py;
                });
            });
            const coordDiv = (maxCoord > 1 && maxCoord <= 100) ? 100 : 1000;
            const sx = (v) => (Number(v) / coordDiv) * W;
            const sy = (v) => (Number(v) / coordDiv) * H;

            saveWbSnapshot();
            for (const cmd of commands) {
                if (!cmd || typeof cmd !== "object") continue;
                const type = String(cmd.type || "").toLowerCase().trim();
                const col = cmd.color || cmd.stroke || "#38bdf8";
                const isRectLike = (type === "rect" || type === "rectangle" || type === "square");
                const rawLw = Number(cmd.lineWidth || cmd.strokeWidth || (isRectLike ? 3.5 : (cmd.width || 3.5)));
                const lw = Math.min(12, Math.max(2, isNaN(rawLw) ? 3.5 : rawLw));

                wbCtx.save();
                wbCtx.globalCompositeOperation = "source-over";
                wbCtx.strokeStyle = col;
                wbCtx.fillStyle = cmd.fill || col;
                wbCtx.lineWidth = lw;
                wbCtx.lineCap = "round";
                wbCtx.lineJoin = "round";

                if (type === "clear") {
                    wbCtx.clearRect(0, 0, W, H);
                } else if (type === "line" || type === "arrow") {
                    const x1 = sx(cmd.x1), y1 = sy(cmd.y1), x2 = sx(cmd.x2), y2 = sy(cmd.y2);
                    if (![x1, y1, x2, y2].some(isNaN)) {
                        wbCtx.beginPath(); wbCtx.moveTo(x1, y1); wbCtx.lineTo(x2, y2); wbCtx.stroke();
                        if (type === "arrow") {
                            const a = Math.atan2(y2 - y1, x2 - x1);
                            wbCtx.beginPath(); wbCtx.moveTo(x2, y2);
                            wbCtx.lineTo(x2 - 12 * Math.cos(a - 0.5), y2 - 12 * Math.sin(a - 0.5));
                            wbCtx.lineTo(x2 - 12 * Math.cos(a + 0.5), y2 - 12 * Math.sin(a + 0.5));
                            wbCtx.closePath(); wbCtx.fill();
                        }
                    }
                } else if (isRectLike) {
                    const rx = sx(cmd.x), ry = sy(cmd.y);
                    const rw = sx(cmd.w !== undefined ? cmd.w : cmd.width);
                    const rh = sy(cmd.h !== undefined ? cmd.h : (cmd.height !== undefined ? cmd.height : cmd.w));
                    if (![rx, ry, rw, rh].some(isNaN)) {
                        if (cmd.fill) { wbCtx.globalAlpha = 0.2; wbCtx.fillRect(rx, ry, rw, rh); wbCtx.globalAlpha = 1; }
                        wbCtx.strokeRect(rx, ry, rw, rh);
                    }
                } else if (type === "circle" || type === "ellipse") {
                    const cx = sx(cmd.cx !== undefined ? cmd.cx : cmd.x);
                    const cy = sy(cmd.cy !== undefined ? cmd.cy : cmd.y);
                    const rVal = cmd.r !== undefined ? cmd.r : (cmd.radius !== undefined ? cmd.radius : 60);
                    const rad = (Number(rVal) / coordDiv) * Math.min(W, H);
                    if (![cx, cy, rad].some(isNaN)) {
                        wbCtx.beginPath(); wbCtx.arc(cx, cy, Math.max(2, rad), 0, Math.PI * 2);
                        if (cmd.fill) { wbCtx.globalAlpha = 0.2; wbCtx.fill(); wbCtx.globalAlpha = 1; }
                        wbCtx.stroke();
                    }
                } else if (type === "triangle" || type === "polygon" || type === "path" || type === "polyline") {
                    let pts = extractNormPoints(cmd.points);
                    if (pts.length === 0 && cmd.x1 !== undefined && cmd.x2 !== undefined && cmd.x3 !== undefined) {
                        pts = [[Number(cmd.x1), Number(cmd.y1)], [Number(cmd.x2), Number(cmd.y2)], [Number(cmd.x3), Number(cmd.y3)]];
                    }
                    if (pts.length >= 2) {
                        wbCtx.beginPath();
                        wbCtx.moveTo(sx(pts[0][0]), sy(pts[0][1]));
                        for (let i = 1; i < pts.length; i++) wbCtx.lineTo(sx(pts[i][0]), sy(pts[i][1]));
                        if (type === "triangle" || type === "polygon" || cmd.closed === true || (type === "path" && pts.length === 3)) {
                            wbCtx.closePath();
                        }
                        if (cmd.fill) { wbCtx.globalAlpha = 0.2; wbCtx.fill(); wbCtx.globalAlpha = 1; }
                        wbCtx.stroke();
                    }
                } else if (type === "text" || type === "label") {
                    const labelStr = cmd.text !== undefined ? cmd.text : cmd.label;
                    const tx = sx(cmd.x !== undefined ? cmd.x : cmd.cx);
                    const ty = sy(cmd.y !== undefined ? cmd.y : cmd.cy);
                    if (labelStr && !isNaN(tx) && !isNaN(ty)) {
                        const fSize = Math.max(13, Math.round((Number(cmd.size || cmd.fontSize || 18) / 600) * Math.min(W, H)));
                        wbCtx.font = `700 ${fSize}px Inter, sans-serif`;
                        wbCtx.fillStyle = col;
                        wbCtx.fillText(String(labelStr), tx, ty);
                    }
                }
                wbCtx.restore();
                await new Promise(r => setTimeout(r, 110));
            }
        }

        function activateLiveReadyUI(modeLabel) {
            document.getElementById("connDot").classList.add("online");

        function connectLiveSocket() {
            if (!sessionToken) {
                document.getElementById("captionBox").textContent = "🔒 Please sign in on the KIZA home screen first.";
                return;
            }
            if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} }
            wsReady = false;
            clearTimeout(wsWatchdog);

            wsWatchdog = setTimeout(() => {
                if (!wsReady) {
                    useHttpFallback = true;
                    activateLiveReadyUI("HTTPS Live");
                    document.getElementById("captionBox").textContent = `Keeza Live ready (HTTPS mode), ${userName}! Tap 🟢 Hands-Free, hold to speak, or ask me to draw on the Whiteboard.`;
                }
            }, 3500);

            try {
                ws = new WebSocket(`${WS_LIVE_URL}?token=${encodeURIComponent(sessionToken)}`);
            } catch (e) {
                useHttpFallback = true; activateLiveReadyUI("HTTPS Live"); return;
            }

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: "auth", token: sessionToken, personality }));
                if (pingInterval) clearInterval(pingInterval);
                pingInterval = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) { pingStart = performance.now(); ws.send(JSON.stringify({ type: "ping" })); }
                }, 12000);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === "pong") {
                    const pEl = document.getElementById("livePing");
                    pEl.textContent = `${Math.max(12, Math.round(performance.now() - pingStart))}ms`; pEl.style.color = "var(--success)";
                } else if (data.type === "state") {
                    clearTimeout(ackTimeout);
                    document.getElementById("liveOrb").classList.toggle("thinking", data.status === "thinking");
                    document.getElementById("liveStatusChip").textContent = data.status === "thinking" ? "KIZA IS THINKING..." : "LIVE & READY";
                    if (data.status === "thinking") document.getElementById("captionBox").textContent = "🧠 Analyzing your request...";
                } else if (data.type === "response") {
                    clearTimeout(ackTimeout); clearTimeout(replyTimeout); clearTimeout(wsWatchdog);
                    wsReady = true; useHttpFallback = false;
                    activateLiveReadyUI(document.getElementById("livePing").textContent === "Connecting..." ? "WS Live" : null);
                    const cleanReply = data.text || "";
                    lastKizaReplyText = cleanReply;
                    document.getElementById("captionBox").textContent = cleanReply;
                    if (cleanReply) callDecisions.push(cleanReply.slice(0, 110));
                    if (Array.isArray(data.draw_commands) && data.draw_commands.length > 0) executeKizaWhiteboardCommands(data.draw_commands);
                    speakLiveResponse(cleanReply, data.audio_base64);
                } else if (data.type === "error") {
                    clearTimeout(ackTimeout); clearTimeout(replyTimeout);
                    document.getElementById("liveOrb").classList.remove("thinking");
                    document.getElementById("liveStatusChip").textContent = "LIVE & READY";
                    document.getElementById("captionBox").textContent = `⚠️ ${data.message}`;
                }
            };
            ws.onerror = () => { if (!wsReady) { useHttpFallback = true; activateLiveReadyUI("HTTPS Live"); } };
            ws.onclose = (ev) => {
                wsReady = false;
                if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }
                if (ev.code === 1008) {
                    clearTimeout(wsWatchdog);
                    document.getElementById("connDot").classList.remove("online");
                    document.getElementById("captionBox").textContent = "🔒 Session ended or temporarily banned. Returning to KIZA...";
                    setTimeout(() => { window.location.href = "index.html"; }, 2200);
                } else {
                    useHttpFallback = true; activateLiveReadyUI("HTTPS Live");
                }
            };
        }

        async function sendLiveSpeechOrText(textStr) {
            const clean = (textStr || "").trim();
            if (!clean) return;
            callTopics.push(clean.slice(0, 90));
            const frameObj = captureCrispActiveFrame(clean);

            if (wsReady && ws && ws.readyState === WebSocket.OPEN && !useHttpFallback) {
                document.getElementById("captionBox").textContent = `⏳ Sending (${frameObj.source}): "${clean}"...`;
                try {
                    ws.send(JSON.stringify({
                        type: "speech",
                        text: clean,
                        personality,
                        image_base64: frameObj.image_base64,
                        vision_source: frameObj.source
                    }));
                } catch (err) {
                    useHttpFallback = true;
                    await sendLiveViaHttp(clean, frameObj);
                    return;
                }
                clearTimeout(ackTimeout);
                ackTimeout = setTimeout(() => {
                    useHttpFallback = true;
                    sendLiveViaHttp(clean, frameObj);
                }, 3000);
                clearTimeout(replyTimeout);
                replyTimeout = setTimeout(() => {
                    useHttpFallback = true;
                    sendLiveViaHttp(clean, frameObj);
                }, 14000);
                return;
            }
            await sendLiveViaHttp(clean, frameObj);
        }

        async function sendLiveViaHttp(cleanText, frameObj) {
            clearTimeout(ackTimeout);
            clearTimeout(replyTimeout);
            document.getElementById("liveOrb").classList.add("thinking");
            document.getElementById("liveStatusChip").textContent = "KIZA IS THINKING...";
            document.getElementById("captionBox").textContent = `🧠 Thinking (${frameObj.source}): "${cleanText}"...`;
            const controller = new AbortController();
            const httpTimer = setTimeout(() => controller.abort(), 20000);
            try {
                const t0 = performance.now();
                const res = await fetch(`${SERVER_HTTP}/api/live/turn`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "X-KIZA-Token": sessionToken },
                    body: JSON.stringify({
                        text: cleanText,
                        personality,
                        image_base64: frameObj.image_base64,
                        vision_source: frameObj.source
                    }),
                    signal: controller.signal
                });
                clearTimeout(httpTimer);
                if (res.status === 401) {
                    document.getElementById("captionBox").textContent = "🔒 Session expired. Returning to KIZA sign-in...";
                    setTimeout(() => { window.location.href = "index.html"; }, 1800);
                    return;
                }
                const rtt = Math.max(20, Math.round(performance.now() - t0));
                const data = await res.json();
                activateLiveReadyUI(`${rtt}ms`);
                const replyTxt = data.text || data.message || "Done.";
                lastKizaReplyText = replyTxt;
                document.getElementById("captionBox").textContent = replyTxt;
                if (data.user_banned || data.ip_banned) {
                    setTimeout(() => { window.location.href = "index.html"; }, 2500);
                    return;
                }
                if (replyTxt) callDecisions.push(replyTxt.slice(0, 110));
                if (Array.isArray(data.draw_commands) && data.draw_commands.length > 0) {
                    executeKizaWhiteboardCommands(data.draw_commands);
                }
                speakLiveResponse(replyTxt, data.audio_base64);
            } catch (e) {
                clearTimeout(httpTimer);
                document.getElementById("liveOrb").classList.remove("thinking");
                document.getElementById("liveStatusChip").textContent = "LIVE & READY";
                document.getElementById("captionBox").textContent = e.name === "AbortError"
                    ? "⚠️ Server took too long (>20s). Try again in a moment."
                    : `⚠️ Error: ${e.message}`;
            }
        }

        function sendTypedLiveMessage() { const i = document.getElementById("liveTextInput"), v = i.value.trim(); if (!v) return; i.value = ""; sendLiveSpeechOrText(v); }
        document.getElementById("liveTextInput").addEventListener("keypress", (e) => { if (e.key === "Enter") sendTypedLiveMessage(); });

        // ==========================================================
        // 5. VOICE PLAYBACK (INDIAN NEURAL + EMOJI REACTIONS) & BARGE-IN
        // ==========================================================
        function humanizeEmojisForSpeech(text) {
            let s = String(text || "").replace(/\bK\.?\s*I\.?\s*Z\.?\s*A\.?\b/gi, "Keeza");
            s = s.replace(/[💖💕💗💓💞💘❤️🩷🥰😍🥺🎀🥹🤗🫶]+/gu, " awww, ");
            s = s.replace(/[😂🤣😆😹]+/gu, " haha, ");
            s = s.replace(/[😮‍💨😌😩😫🫠✨]+/gu, " ahhh, ");
            s = s.replace(/[😮🤯😱🔥⚡]+/gu, " oooh, ");
            s = s.replace(/[😢😭😔💔]+/gu, " oh no, ");
            s = s.replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu, " ");
            s = s.replace(/(\b(?:awww|ahhh|haha|oooh|oh no)\b,?\s*){2,}/gi, "$1");
            return s.replace(/\s+/g, " ").trim();
        }

        function interruptKizaSpeech() {
            if (activeAudio) { try { activeAudio.pause(); activeAudio = null; } catch (e) {} }
            if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch (e) {} }
            isKizaSpeaking = false;
            document.getElementById("liveOrb").classList.remove("speaking");
        }

        function toggleSpeakerMute() {
            speakerMuted = !speakerMuted;
            document.getElementById("muteBtn").textContent = speakerMuted ? "🔇 Muted" : "🔊 Sound";
            if (speakerMuted) interruptKizaSpeech();
        }

        function speakLiveResponse(text, audioBase64) {
            if (speakerMuted || !text) { if (vadEnabled) startVadRecognition(); return; }
            interruptKizaSpeech();
            stopVadRecognitionTemporarily();

            const orb = document.getElementById("liveOrb");
            const onSpeechEnd = () => {
                isKizaSpeaking = false;
                orb.classList.remove("speaking");
                if (vadEnabled) setTimeout(startVadRecognition, 250);
            };

            if (audioBase64) {
                activeAudio = new Audio("data:audio/mp3;base64," + audioBase64);
                isKizaSpeaking = true; orb.classList.add("speaking");
                activeAudio.onended = onSpeechEnd; activeAudio.onerror = onSpeechEnd;
                activeAudio.play().catch(onSpeechEnd);
                return;
            }
            if (window.speechSynthesis) {
                const spoken = humanizeEmojisForSpeech(text);
                if (!spoken) { onSpeechEnd(); return; }
                const u = new SpeechSynthesisUtterance(spoken);
                const low = text.toLowerCase();
                let targetLang = "en-IN";
                if (/[\u0A00-\u0A7F]/.test(text) || /\b(kive|pra|paaji|veere|tusi|vadiya|sat sri akal)\b/i.test(low)) targetLang = "pa-IN";
                else if (/[\u0900-\u097F]/.test(text) || /\b(kaise|hoon|aap|theek|kya|bhai|bilkul)\b/i.test(low)) targetLang = "hi-IN";
                u.lang = targetLang;
                const voices = window.speechSynthesis.getVoices() || [];
                const indianRx = /neerja|prabhat|heera|ravi|madhur|swara|india/i;
                const match = voices.find(v => v.lang.toLowerCase() === targetLang.toLowerCase() && indianRx.test(v.name)) || voices.find(v => v.lang.toLowerCase() === targetLang.toLowerCase()) || voices.find(v => indianRx.test(v.name));
                if (match) u.voice = match;
                isKizaSpeaking = true;
                u.onstart = () => orb.classList.add("speaking");
                u.onend = onSpeechEnd; u.onerror = onSpeechEnd;
                window.speechSynthesis.speak(u);
            }
        }

        // ==========================================================
        // 6. HANDS-FREE VOICE ACTIVITY DETECTION (VAD) + BARGE-IN
        // ==========================================================
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        let vadEnabled = false, vadAudioCtx = null, vadAnalyser = null, vadMicStream = null;
        let vadRaf = null, vadRec = null, vadTranscript = "", vadSilenceTimer = null, bargeInTicks = 0;

        async function toggleHandsFreeVAD() {
            const btn = document.getElementById("vadToggleBtn");
            if (vadEnabled) {
                vadEnabled = false;
                btn.classList.remove("vad-on"); btn.textContent = "🟢 Hands-Free: Off";
                document.getElementById("vadMeter").style.display = "none";
                document.getElementById("liveOrb").classList.remove("listening");
                document.getElementById("liveStatusChip").textContent = "LIVE & READY";
                if (vadRaf) cancelAnimationFrame(vadRaf);
                stopVadRecognitionTemporarily();
                if (vadMicStream) { vadMicStream.getTracks().forEach(t => t.stop()); vadMicStream = null; }
                if (vadAudioCtx) { try { vadAudioCtx.close(); } catch (e) {} vadAudioCtx = null; }
                return;
            }
            if (!SR) {
                document.getElementById("captionBox").textContent = "Hands-Free speech recognition requires Chrome or Edge.";
                return;
            }
            try {
                vadMicStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });
                vadAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const src = vadAudioCtx.createMediaStreamSource(vadMicStream);
                vadAnalyser = vadAudioCtx.createAnalyser();
                vadAnalyser.fftSize = 512;
                src.connect(vadAnalyser);

                vadEnabled = true;
                btn.classList.add("vad-on"); btn.textContent = "🟢 Hands-Free: ON";
                document.getElementById("vadMeter").style.display = "inline-flex";
                document.getElementById("liveStatusChip").textContent = "HANDS-FREE LISTENING";
                document.getElementById("captionBox").textContent = "🟢 Hands-Free VAD ON — just speak naturally! Talk anytime to interrupt KIZA.";
                monitorVadAndBargeIn();
                startVadRecognition();
            } catch (e) {
                document.getElementById("captionBox").textContent = `⚠️ Mic access denied: ${e.message}`;
            }
        }

        function monitorVadAndBargeIn() {
            if (!vadEnabled || !vadAnalyser) return;
            const buf = new Uint8Array(vadAnalyser.fftSize);
            vadAnalyser.getByteTimeDomainData(buf);
            let sum = 0;
            for (let i = 0; i < buf.length; i++) {
                const v = (buf[i] - 128) / 128;
                sum += v * v;
            }
            const rms = Math.sqrt(sum / buf.length);

            const h = Math.min(14, Math.max(3, Math.round(rms * 110)));
            document.getElementById("vb1").style.height = `${Math.max(3, Math.round(h * 0.7))}px`;
            document.getElementById("vb2").style.height = `${h}px`;
            document.getElementById("vb3").style.height = `${Math.max(3, Math.round(h * 0.85))}px`;

            if (isKizaSpeaking) {
                if (rms > 0.072) {
                    bargeInTicks++;
                    if (bargeInTicks >= 5) {
                        bargeInTicks = 0;
                        interruptKizaSpeech();
                        document.getElementById("captionBox").textContent = "✋ Interrupted — listening to you...";
                        startVadRecognition();
                    }
                } else {
                    bargeInTicks = Math.max(0, bargeInTicks - 1);
                }
            }
            vadRaf = requestAnimationFrame(monitorVadAndBargeIn);
        }

        function stopVadRecognitionTemporarily() {
            clearTimeout(vadSilenceTimer);
            if (vadRec) { try { vadRec.onend = null; vadRec.stop(); } catch (e) {} vadRec = null; }
            document.getElementById("liveOrb").classList.remove("listening");
        }

        function startVadRecognition() {
            if (!vadEnabled || !SR || isKizaSpeaking) return;
            if (vadRec) return;
            vadTranscript = "";
            vadRec = new SR();
            vadRec.lang = document.getElementById("speechLangSelect").value || "en-IN";
            vadRec.continuous = true;
            vadRec.interimResults = true;
            vadRec.onstart = () => document.getElementById("liveOrb").classList.add("listening");
            vadRec.onresult = (ev) => {
                let full = "";
                for (let i = 0; i < ev.results.length; i++) full += ev.results[i][0].transcript;
                vadTranscript = full.trim();
                if (vadTranscript) {
                    document.getElementById("captionBox").textContent = `🎙️ ${vadTranscript}`;
                    clearTimeout(vadSilenceTimer);
                    vadSilenceTimer = setTimeout(() => {
                        const toSend = vadTranscript.trim();
                        vadTranscript = "";
                        stopVadRecognitionTemporarily();
                        if (toSend.length > 1) sendLiveSpeechOrText(toSend);
                    }, 1350);
                }
            };
            vadRec.onerror = () => { vadRec = null; if (vadEnabled && !isKizaSpeaking) setTimeout(startVadRecognition, 500); };
            vadRec.onend = () => { vadRec = null; document.getElementById("liveOrb").classList.remove("listening"); if (vadEnabled && !isKizaSpeaking) setTimeout(startVadRecognition, 350); };
            try { vadRec.start(); } catch (e) { vadRec = null; }
        }

        // Manual Push-to-Talk fallback
        let pttRec = null, pttTranscript = "";
        const pttBtn = document.getElementById("pttBtn");
        function startPTT(e) {
            if (e) e.preventDefault();
            if (!SR) return;
            interruptKizaSpeech();
            stopVadRecognitionTemporarily();
            pttTranscript = "";
            pttRec = new SR(); pttRec.lang = document.getElementById("speechLangSelect").value || "en-IN"; pttRec.interimResults = true; pttRec.continuous = true;
            pttRec.onresult = (ev) => { let t = ""; for (let i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript; pttTranscript = t.trim(); if (pttTranscript) document.getElementById("captionBox").textContent = `🎙️ ${pttTranscript}`; };
            try { pttRec.start(); pttBtn.classList.add("listening"); pttBtn.textContent = "🎙️ Listening..."; } catch (err) {}
        }
        function stopPTT(e) {
            if (e) e.preventDefault();
            pttBtn.classList.remove("listening"); pttBtn.textContent = "🎙️ Hold";
            if (pttRec) { try { pttRec.stop(); } catch (err) {} pttRec = null; setTimeout(() => { if (pttTranscript) { sendLiveSpeechOrText(pttTranscript); pttTranscript = ""; } }, 240); }
        }
        pttBtn.addEventListener("mousedown", startPTT);
        window.addEventListener("mouseup", () => { if (pttBtn.classList.contains("listening")) stopPTT(); });
        pttBtn.addEventListener("touchstart", startPTT, { passive: false });
        pttBtn.addEventListener("touchend", stopPTT, { passive: false });

        function endLiveCall() {
            if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }
            if (vadEnabled) toggleHandsFreeVAD();
            if (camStream) camStream.getTracks().forEach(t => t.stop());
            if (screenStream) screenStream.getTracks().forEach(t => t.stop());
            if (ws) try { ws.close(); } catch (e) {}
            try {
                localStorage.setItem("kiza_last_call_minutes", JSON.stringify({
                    duration: document.getElementById("callTimer").textContent,
                    timestamp: new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }),
                    topics: callTopics.slice(-6),
                    decisions: callDecisions.slice(-6)
                }));
            } catch (e) {}
            window.location.href = "index.html";
        }

        startCameraFeed();
        connectLiveSocket();
    </script>
</body>
