<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050811">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>KIZA Live — Voice, Video & Screen Call</title>
    <link rel="icon" type="image/png" id="liveFavicon" href="logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-height: 100%;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --bg-deep: #050811;
            --card-surface: rgba(15, 23, 42, 0.92);
            --border-cyan: rgba(0, 242, 254, 0.32);
            --accent-cyan: #00f2fe;
            --accent-blue: #0284c7;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        /* SAFARI & MOBILE VIEWPORT LOCK — NEVER SCROLLS OR CLIPS BOTTOM */
        html, body {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
            background: radial-gradient(circle at 50% 30%, #0c1938 0%, #050811 75%);
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: manipulation;
        }

        .live-shell {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: var(--app-height, 100%);
            max-height: var(--app-height, 100%);
            padding: calc(8px + var(--safe-top)) 12px max(14px, calc(var(--safe-bottom) + 10px)) 12px;
            position: relative;
            overflow: hidden;
        }

        /* TOP STATUS BAR */
        .top-hud {
            width: 100%;
            max-width: 660px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            z-index: 20;
        }

        .hud-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 11px;
            border-radius: 999px;
            background: var(--card-surface);
            border: 1px solid var(--border-cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(10px, 2.5vw, 11.5px);
            font-weight: 700;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            flex-shrink: 0;
            animation: pulseOpacity 1.4s infinite alternate;
        }
        @keyframes pulseOpacity { from { opacity: 1; } to { opacity: 0.35; } }

        /* FLOATING CAMERA / SCREEN PIP (HARDWARE ACCELERATED) */
        .vision-pip {
            position: absolute;
            top: calc(50px + var(--safe-top));
            right: 14px;
            width: clamp(96px, 24vw, 142px);
            height: clamp(72px, 18vw, 106px);
            border-radius: 12px;
            overflow: hidden;
            border: 1.5px solid var(--accent-cyan);
            background: #090d16;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
            z-index: 30;
            transform: translate3d(0, 0, 0);
        }
        .vision-pip video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .vision-badge {
            position: absolute;
            bottom: 4px;
            left: 4px;
            right: 4px;
            background: rgba(5, 8, 17, 0.88);
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: 8.5px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 5px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* CENTER STAGE — AUTOMATICALLY SHRINKS ON SMALL SCREENS */
        .center-stage {
            flex: 1 1 0%;
            min-height: 0;
            width: 100%;
            max-width: 620px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(6px, 1.4vh, 12px);
            z-index: 10;
            padding: 2px 0;
            overflow: hidden;
        }

        .orb-wrapper {
            position: relative;
            width: clamp(104px, 19vh, 175px);
            height: clamp(104px, 19vh, 175px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transform: translate3d(0, 0, 0);
        }

        #liveSpectrumCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .live-orb {
            width: 68%;
            height: 68%;
            border-radius: 50%;
            border: 2.5px solid var(--accent-cyan);
            box-shadow: 0 0 28px rgba(0, 242, 254, 0.45);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 35% 30%, #38bdf8 0%, #4f46e5 55%, #071324 100%);
            will-change: transform;
            transition: transform 0.08s linear;
            z-index: 2;
        }
        .live-orb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .state-pill {
            padding: 5px 14px;
            border-radius: 999px;
            background: rgba(2, 132, 199, 0.22);
            border: 1px solid var(--border-cyan);
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(10px, 1.6vh, 11.5px);
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            text-align: center;
            flex-shrink: 0;
        }

        .subtitle-card {
            width: 100%;
            background: var(--card-surface);
            border: 1px solid var(--border-cyan);
            border-radius: 16px;
            padding: clamp(8px, 1.5vh, 14px) 14px;
            text-align: center;
            font-size: clamp(13px, 1.9vh, 15.5px);
            font-weight: 600;
            line-height: 1.42;
            color: #f8fafc;
            max-height: clamp(68px, 18vh, 140px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        .helper-caption {
            font-size: 10.5px;
            color: #94a3b8;
            text-align: center;
            line-height: 1.3;
            padding: 0 6px;
            flex-shrink: 0;
        }

        /* FLOATING HARDWARE SELECTOR MODAL */
        #liveDeviceDrawer {
            display: none;
            position: absolute;
            bottom: calc(145px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            border: 1.5px solid var(--accent-cyan);
            border-radius: 16px;
            padding: 12px 14px;
            width: 92%;
            max-width: 360px;
            z-index: 60;
            flex-direction: column;
            gap: 7px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.75);
        }
        #liveDeviceDrawer select {
            background: #050811;
            color: #f8fafc;
            border: 1px solid var(--border-cyan);
            padding: 7px 9px;
            border-radius: 8px;
            font-size: 12px;
            width: 100%;
            outline: none;
        }

        /* BOTTOM CONTROLS DOCK — GUARANTEED NO CUTOFF IN SAFARI OR PWA */
        .bottom-dock {
            width: 100%;
            max-width: 620px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(6px, 1.1vh, 9px);
            flex-shrink: 0;
            z-index: 25;
            padding-bottom: 2px;
        }

        .text-bar {
            width: 100%;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .text-bar input {
            flex: 1;
            min-width: 0;
            background: var(--card-surface);
            border: 1px solid var(--border-cyan);
            color: #f8fafc;
            padding: 8px 13px;
            border-radius: 999px;
            font-size: 14px; /* 14px+ prevents iOS Safari auto-zoom glitch */
            outline: none;
        }
        .text-bar button {
            background: linear-gradient(135deg, #00f2fe 0%, #3b82f6 100%);
            border: none;
            color: #050811;
            font-weight: 800;
            font-size: 11.5px;
            padding: 8px 16px;
            border-radius: 999px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .action-dock-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(6px, 2vw, 11px);
            width: 100%;
            flex-wrap: nowrap;
        }

        .ctrl-circle {
            width: clamp(38px, 5.6vh, 46px);
            height: clamp(38px, 5.6vh, 46px);
            border-radius: 50%;
            background: var(--card-surface);
            border: 1.5px solid var(--border-cyan);
            color: #f8fafc;
            font-size: clamp(15px, 2.2vh, 17px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
            flex-shrink: 0;
            padding: 0;
        }
        .ctrl-circle.active {
            border-color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.18);
        }
        .ctrl-circle.muted {
            border-color: var(--danger);
            color: var(--danger);
        }

        .hangup-pill {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border: none;
            color: #ffffff;
            font-family: inherit;
            font-size: clamp(11.5px, 1.8vh, 13px);
            font-weight: 800;
            letter-spacing: 0.5px;
            height: clamp(38px, 5.6vh, 46px);
            padding: 0 clamp(14px, 3.5vw, 22px);
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.45);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        @media (max-height: 640px) {
            .helper-caption { display: none; }
            .orb-wrapper { width: 92px; height: 92px; }
            .subtitle-card { max-height: 64px; font-size: 12.5px; padding: 6px 10px; }
        }
    </style>
</head>
<body>
    <input type="file" id="mobileScreenShareInput" accept="image/*" style="display:none;">

    <div class="live-shell" id="liveShell">
        <!-- TOP HUD -->
        <div class="top-hud">
            <div class="hud-pill">
                <span class="live-dot"></span>
                <span id="liveHeaderTitle">KIZA LIVE • 00:00</span>
            </div>
            <div class="hud-pill">
                <span id="personaLabel">UK • Witty</span>
                <span id="pingBadge" style="color:#10b981; font-size:10px;">•⚡Online</span>
            </div>
        </div>

        <!-- FLOATING CAMERA / SCREEN PIP -->
        <div class="vision-pip">
            <video id="camPreview" autoplay playsinline webkit-playsinline muted></video>
            <!-- Lightweight 320x240 buffer canvas for zero-lag frame encoding -->
            <canvas id="captureCanvas" width="320" height="240" style="display:none;"></canvas>
            <div class="vision-badge" id="visionModeBadge">👁️ CAM VISION</div>
        </div>

        <!-- CENTER STAGE -->
        <div class="center-stage">
            <div class="orb-wrapper">
                <canvas id="liveSpectrumCanvas" width="160" height="160"></canvas>
                <div class="live-orb" id="liveOrb">
                    <img id="liveLogoImg" src="logo.jpg" alt="KIZA" onerror="this.style.display='none'">
                </div>
            </div>

            <div class="state-pill" id="liveStateText">🎙️ KIZA LISTENING...</div>

            <div class="subtitle-card" id="aiSubtitleBox">
                Connecting live voice and vision link...
            </div>

            <div class="helper-caption">
                💡 Tap 🖥️ to share screen/notes, ⚙️ to switch mic/camera, or ✋ to interrupt KIZA.
            </div>
        </div>

        <!-- FLOATING MIC & CAMERA SELECTOR DRAWER -->
        <div id="liveDeviceDrawer">
            <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:700; color:var(--accent-cyan);">
                <span>🎛️ Camera & Microphone</span>
                <button type="button" style="background:none; border:none; color:#94a3b8; font-size:15px; cursor:pointer;" onclick="toggleLiveDeviceDrawer()">✕</button>
            </div>
            <label style="font-size:10.5px; color:#cbd5e1; font-weight:600;">📷 Select Camera:</label>
            <select id="liveCamSelect" onchange="switchLiveCameraDevice(this.value)"></select>
            <label style="font-size:10.5px; color:#cbd5e1; font-weight:600;">🎤 Select Microphone:</label>
            <select id="liveMicSelect" onchange="switchLiveMicDevice(this.value)"></select>
        </div>

        <!-- BOTTOM CONTROLS DOCK (SINGLE UNIFIED ROW FOR CONTROLS + END CALL SO IT NEVER CUTS OFF) -->
        <div class="bottom-dock">
            <div class="text-bar">
                <input type="text" id="liveTextInput" placeholder="Type a message during the call..." autocomplete="off">
                <button type="button" onclick="sendTypedMessage()">SEND</button>
            </div>

            <div class="action-dock-row">
                <button type="button" class="ctrl-circle active" id="micBtn" onclick="toggleMic()" title="Mute / Unmute Mic">🎤</button>
                <button type="button" class="ctrl-circle active" id="camBtn" onclick="toggleCam()" title="Camera On / Off">📷</button>
                <button type="button" class="ctrl-circle" id="screenBtn" onclick="toggleScreenShare()" title="Share Screen or Rear Cam">🖥️</button>
                <button type="button" class="ctrl-circle" onclick="flipCamera()" title="Flip Camera">🔄</button>
                <button type="button" class="ctrl-circle" onclick="toggleLiveDeviceDrawer()" title="Select Mic & Camera">⚙️</button>
                <button type="button" class="ctrl-circle" onclick="interruptKiza()" title="Interrupt KIZA">✋</button>
                <button type="button" class="hangup-pill" onclick="endLiveCall()" title="End Live Call">
                    <span>📞 END</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const WS_LIVE_URL = "wss://kiza-brain.onrender.com/api/live/call";

        // ==========================================================
        // 1. SAFARI & MOBILE VISUAL VIEWPORT LOCK (ZERO BOTTOM CUTOFF)
        // ==========================================================
        (function initSafariViewportLock() {
            function syncViewport() {
                const vv = window.visualViewport;
                const h = vv ? Math.round(vv.height) : window.innerHeight;
                if (h && h > 120) {
                    document.documentElement.style.setProperty('--app-height', `${h}px`);
                }
                if (window.scrollY !== 0 || window.scrollX !== 0) {
                    window.scrollTo(0, 0);
                }
            }
            syncViewport();
            window.addEventListener('resize', syncViewport, { passive: true });
            window.addEventListener('orientationchange', () => setTimeout(syncViewport, 150), { passive: true });
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', syncViewport, { passive: true });
                window.visualViewport.addEventListener('scroll', syncViewport, { passive: true });
            }
            document.addEventListener('touchend', () => {
                if (window.scrollY !== 0) window.scrollTo(0, 0);
            }, { passive: true });
        })();

        // ==========================================================
        // 2. AUTO-CIRCULAR LOGO CROPPER
        // ==========================================================
        (function initCircularLiveLogo() {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
                try {
                    const c = document.createElement('canvas');
                    c.width = 256; c.height = 256;
                    const ctx = c.getContext('2d');
                    const minDim = Math.min(img.naturalWidth || 256, img.naturalHeight || 256) * 0.94;
                    const sx = ((img.naturalWidth || 256) - minDim) / 2;
                    const sy = ((img.naturalHeight || 256) - minDim) / 2;
                    ctx.beginPath();
                    ctx.arc(128, 128, 128, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.clip();
                    ctx.fillStyle = "#071324";
                    ctx.fillRect(0, 0, 256, 256);
                    ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, 256, 256);
                    const dataUrl = c.toDataURL('image/png');
                    const logoEl = document.getElementById('liveLogoImg');
                    if (logoEl) logoEl.src = dataUrl;
                    const fav = document.getElementById('liveFavicon');
                    if (fav) fav.href = dataUrl;
                } catch (e) {}
            };
            img.src = "logo.jpg";
        })();

        const params = new URLSearchParams(window.location.search);
        const currentUser = params.get("user") || localStorage.getItem("kiza_user") || "User";
        const currentPersona = params.get("persona") || "normal";

        const personaNames = {
            normal: "UK • Witty",
            helpful: "IN • Warm",
            energetic: "US • Fast",
            security: "Security"
        };
        document.getElementById('personaLabel').innerText = personaNames[currentPersona] || "UK • Witty";

        let ws = null;
        let callSeconds = 0;
        let micActive = true;
        let camActive = true;
        let isScreenSharing = false;
        let camStream = null;
        let screenStream = null;
        let liveMicStream = null;
        let videoDevices = [];
        let audioDevices = [];
        let camIdx = 0;
        let livePreferredCamId = localStorage.getItem('kiza_pref_cam_id') || "";
        let livePreferredMicId = localStorage.getItem('kiza_pref_mic_id') || "";

        let recognition = null;
        let isKizaSpeaking = false;
        let isWaitingResponse = false;
        let currentAudio = null;
        let audioCtx = null;
        let lastPingSentAt = 0;

        setInterval(() => {
            callSeconds++;
            const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
            const secs = String(callSeconds % 60).padStart(2, '0');
            const shortUser = currentUser.split(' ')[0].toUpperCase();
            document.getElementById('liveHeaderTitle').innerText = `KIZA LIVE • ${shortUser} • ${mins}:${secs}`;
        }, 1000);

        // Unlock Safari / iOS AudioContext on first tap anywhere
        function unlockSafariAudio() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {}
        }
        document.addEventListener('touchstart', unlockSafariAudio, { once: true, passive: true });
        document.addEventListener('click', unlockSafariAudio, { once: true, passive: true });

        // ==========================================================
        // 3. CAMERA, MICROPHONE & HARDWARE SELECTOR ENGINE
        // ==========================================================
        async function populateLiveHardwareSelectors() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
            try {
                const devs = await navigator.mediaDevices.enumerateDevices();
                videoDevices = devs.filter(d => d.kind === 'videoinput');
                audioDevices = devs.filter(d => d.kind === 'audioinput');

                const camSel = document.getElementById('liveCamSelect');
                if (camSel) {
                    camSel.innerHTML = '';
                    videoDevices.forEach((d, i) => {
                        const opt = document.createElement('option');
                        opt.value = d.deviceId;
                        opt.textContent = d.label || `Camera ${i + 1}`;
                        if (d.deviceId === livePreferredCamId) opt.selected = true;
                        camSel.appendChild(opt);
                    });
                }

                const micSel = document.getElementById('liveMicSelect');
                if (micSel) {
                    micSel.innerHTML = '';
                    audioDevices.forEach((d, i) => {
                        const opt = document.createElement('option');
                        opt.value = d.deviceId;
                        opt.textContent = d.label || `Microphone ${i + 1}`;
                        if (d.deviceId === livePreferredMicId) opt.selected = true;
                        micSel.appendChild(opt);
                    });
                }
            } catch (e) {}
        }

        function toggleLiveDeviceDrawer() {
            const d = document.getElementById('liveDeviceDrawer');
            if (!d) return;
            const isOpening = (d.style.display !== "flex");
            d.style.display = isOpening ? "flex" : "none";
            if (isOpening) populateLiveHardwareSelectors();
        }

        async function switchLiveCameraDevice(deviceId) {
            livePreferredCamId = deviceId || "";
            localStorage.setItem('kiza_pref_cam_id', livePreferredCamId);
            isScreenSharing = false;
            document.getElementById('screenBtn').classList.remove('active');
            document.getElementById('visionModeBadge').innerText = "👁️ CAM VISION";
            await initCamera();
        }

        async function switchLiveMicDevice(deviceId) {
            livePreferredMicId = deviceId || "";
            localStorage.setItem('kiza_pref_mic_id', livePreferredMicId);
            try {
                if (liveMicStream) liveMicStream.getTracks().forEach(t => t.stop());
                liveMicStream = await navigator.mediaDevices.getUserMedia({
                    audio: livePreferredMicId ? { deviceId: { exact: livePreferredMicId } } : true,
                    video: false
                });
                if (recognition && micActive) {
                    try { recognition.stop(); } catch (e) {}
                }
            } catch (e) {}
        }

        async function initCamera() {
            if (!camActive || isScreenSharing) return;
            try {
                if (camStream) camStream.getTracks().forEach(t => t.stop());
                const constraint = livePreferredCamId
                    ? { deviceId: { exact: livePreferredCamId }, width: { ideal: 480 }, height: { ideal: 360 } }
                    : { facingMode: "user", width: { ideal: 480 }, height: { ideal: 360 } };

                try {
                    camStream = await navigator.mediaDevices.getUserMedia({ video: constraint, audio: false });
                } catch (errFallback) {
                    livePreferredCamId = "";
                    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                }

                const videoEl = document.getElementById('camPreview');
                videoEl.srcObject = camStream;
                const track = camStream.getVideoTracks()[0];
                if (track && track.getSettings().deviceId) {
                    livePreferredCamId = track.getSettings().deviceId;
                }
                await populateLiveHardwareSelectors();
            } catch (e) {}
        }

        // Zero-Lag Lightweight Frame Capture (320x240 @ 0.58 quality)
        function captureCurrentVisionFrame() {
            try {
                if (!camActive && !isScreenSharing) return null;
                const videoEl = document.getElementById('camPreview');
                if (!videoEl || !videoEl.srcObject || videoEl.readyState < 2) return null;
                const canvas = document.getElementById('captureCanvas');
                const ctx = canvas.getContext('2d', { alpha: false });
                ctx.drawImage(videoEl, 0, 0, 320, 240);
                return canvas.toDataURL('image/jpeg', 0.58);
            } catch (e) {
                return null;
            }
        }

        // Background telemetry frame sent every 4.5s ONLY when idle (eliminates WebSocket lag!)
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN && !isWaitingResponse && !isKizaSpeaking && (camActive || isScreenSharing)) {
                const frame = captureCurrentVisionFrame();
                if (frame) {
                    ws.send(JSON.stringify({ type: "frame", image_base64: frame }));
                }
            }
        }, 4500);

        // ==========================================================
        // 4. SCREEN SHARE WITH MOBILE REAR-CAM & SCREENSHOT FALLBACK
        // ==========================================================
        document.getElementById('mobileScreenShareInput').addEventListener('change', (ev) => {
            const file = ev.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas');
                    c.width = 480; c.height = 360;
                    c.getContext('2d').drawImage(img, 0, 0, 480, 360);
                    const snapB64 = c.toDataURL('image/jpeg', 0.72);
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: "frame", image_base64: snapB64 }));
                        ws.send(JSON.stringify({
                            type: "speech",
                            text: "I just shared my screen snapshot with you. Tell me what you see on my screen.",
                            image_base64: snapB64,
                            personality: currentPersona
                        }));
                    }
                    document.getElementById('aiSubtitleBox').innerText = "📲 Screen snapshot sent! KIZA is analyzing it now...";
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });

        async function toggleScreenShare() {
            const screenBtn = document.getElementById('screenBtn');
            const videoEl = document.getElementById('camPreview');
            const badgeEl = document.getElementById('visionModeBadge');

            if (isScreenSharing) {
                isScreenSharing = false;
                if (screenStream) {
                    screenStream.getTracks().forEach(t => t.stop());
                    screenStream = null;
                }
                screenBtn.classList.remove('active');
                badgeEl.innerText = "👁️ CAM VISION";
                await initCamera();
                return;
            }

            if (navigator.mediaDevices && typeof navigator.mediaDevices.getDisplayMedia === 'function') {
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
                    isScreenSharing = true;
                    screenBtn.classList.add('active');
                    videoEl.srcObject = screenStream;
                    badgeEl.innerText = "🖥️ SCREEN LIVE";
                    screenStream.getVideoTracks()[0].onended = () => {
                        if (isScreenSharing) toggleScreenShare();
                    };
                    return;
                } catch (err) {
                    if (err.name === "NotAllowedError" && !/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                        return;
                    }
                }
            }

            try {
                if (camStream) camStream.getTracks().forEach(t => t.stop());
                screenStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 480 }, height: { ideal: 360 } },
                    audio: false
                });
                isScreenSharing = true;
                screenBtn.classList.add('active');
                videoEl.srcObject = screenStream;
                badgeEl.innerText = "🖥️ WORKSPACE LIVE";
                document.getElementById('aiSubtitleBox').innerHTML =
                    `📲 <b>Workspace Vision Active!</b> Point your camera at your notes/laptop, or <u style="color:#00f2fe;cursor:pointer;" onclick="document.getElementById('mobileScreenShareInput').click()">tap here to upload a screenshot</u>!`;
            } catch (fallbackErr) {
                document.getElementById('mobileScreenShareInput').click();
            }
        }

        function toggleCam() {
            camActive = !camActive;
            const btn = document.getElementById('camBtn');
            btn.classList.toggle('active', camActive);
            btn.classList.toggle('muted', !camActive);
            if (camActive) {
                initCamera();
            } else if (camStream) {
                camStream.getTracks().forEach(t => t.stop());
            }
        }

        async function flipCamera() {
            await populateLiveHardwareSelectors();
            if (videoDevices.length <= 1) return;
            camIdx = (camIdx + 1) % videoDevices.length;
            await switchLiveCameraDevice(videoDevices[camIdx].deviceId);
        }

        function toggleMic() {
            micActive = !micActive;
            const btn = document.getElementById('micBtn');
            btn.classList.toggle('active', micActive);
            btn.classList.toggle('muted', !micActive);
            if (!micActive && recognition) {
                try { recognition.stop(); } catch (e) {}
                document.getElementById('liveStateText').innerText = "🔇 MICROPHONE MUTED";
            } else if (micActive && recognition) {
                try { recognition.start(); } catch (e) {}
                document.getElementById('liveStateText').innerText = "🎙️ KIZA LISTENING...";
            }
        }

        function interruptKiza() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            isKizaSpeaking = false;
            isWaitingResponse = false;
            document.getElementById('liveOrb').style.transform = "scale(1)";
            document.getElementById('liveStateText').innerText = "🎙️ KIZA LISTENING...";
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "interrupt" }));
            }
            if (micActive && recognition) {
                setTimeout(() => { try { recognition.start(); } catch (e) {} }, 120);
            }
        }

        // ==========================================================
        // 5. SAFARI-SAFE LOW-LATENCY AUDIO PLAYER
        // ==========================================================
        function playLiveAudio(base64Data, textFallback) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            isWaitingResponse = false;
            isKizaSpeaking = true;
            document.getElementById('liveStateText').innerText = "🔊 KIZA SPEAKING (TAP ✋ TO INTERRUPT)";
            const orb = document.getElementById('liveOrb');

            const onSpeechFinished = () => {
                isKizaSpeaking = false;
                orb.style.transform = "scale(1)";
                document.getElementById('liveStateText').innerText = micActive ? "🎙️ KIZA LISTENING..." : "🔇 MICROPHONE MUTED";
                if (micActive && recognition) {
                    setTimeout(() => { try { recognition.start(); } catch (e) {} }, 150);
                }
            };

            if (!base64Data) {
                if (window.speechSynthesis && textFallback) {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(textFallback);
                    u.onend = onSpeechFinished;
                    u.onerror = onSpeechFinished;
                    window.speechSynthesis.speak(u);
                } else {
                    onSpeechFinished();
                }
                return;
            }

            currentAudio = new Audio("data:audio/mp3;base64," + base64Data);
            currentAudio.playsInline = true;

            // Lightweight pulse animation without blocking WebKit Audio
            let pulseInterval = setInterval(() => {
                if (!isKizaSpeaking) {
                    clearInterval(pulseInterval);
                    orb.style.transform = "scale(1)";
                    return;
                }
                const s = (1.03 + Math.random() * 0.14).toFixed(3);
                orb.style.transform = `scale(${s})`;
            }, 90);

            currentAudio.onended = () => {
                clearInterval(pulseInterval);
                onSpeechFinished();
            };
            currentAudio.onerror = () => {
                clearInterval(pulseInterval);
                if (window.speechSynthesis && textFallback) {
                    const u = new SpeechSynthesisUtterance(textFallback);
                    u.onend = onSpeechFinished;
                    window.speechSynthesis.speak(u);
                } else {
                    onSpeechFinished();
                }
            };
            currentAudio.play().catch(() => {
                clearInterval(pulseInterval);
                if (window.speechSynthesis && textFallback) {
                    const u = new SpeechSynthesisUtterance(textFallback);
                    u.onend = onSpeechFinished;
                    window.speechSynthesis.speak(u);
                } else {
                    onSpeechFinished();
                }
            });
        }

        function sendSpeechToServer(textStr) {
            const clean = (textStr || "").trim();
            if (!clean || !ws || ws.readyState !== WebSocket.OPEN) return;
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            isKizaSpeaking = false;
            isWaitingResponse = true;

            document.getElementById('liveStateText').innerText = "⚡ KIZA THINKING...";
            document.getElementById('aiSubtitleBox').innerText = `You: "${clean}"`;
            const snap = captureCurrentVisionFrame();
            ws.send(JSON.stringify({
                type: "speech",
                text: clean,
                image_base64: snap,
                personality: currentPersona
            }));
        }

        function sendTypedMessage() {
            const inp = document.getElementById('liveTextInput');
            const val = inp.value.trim();
            if (!val) return;
            inp.value = "";
            inp.blur();
            sendSpeechToServer(val);
        }

        document.getElementById('liveTextInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendTypedMessage();
        });

        // ==========================================================
        // 6. SAFARI & CHROME COMPATIBLE SPEECH RECOGNITION
        // ==========================================================
        function initLiveSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                document.getElementById('liveStateText').innerText = "⌨️ TYPE BELOW TO CHAT LIVE";
                return;
            }
            const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
            recognition = new SpeechRecognition();
            // Safari works much more reliably with continuous=false + automatic onend restart
            recognition.continuous = !isSafari;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                if (!micActive || isWaitingResponse) return;
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript.trim();
                    if (isKizaSpeaking && transcript.length > 4) {
                        interruptKiza();
                    }
                    if (event.results[i].isFinal && transcript.length > 1) {
                        sendSpeechToServer(transcript);
                    }
                }
            };
            recognition.onerror = () => {};
            recognition.onend = () => {
                if (micActive && !isKizaSpeaking && !isWaitingResponse) {
                    setTimeout(() => {
                        if (micActive && !isKizaSpeaking && !isWaitingResponse) {
                            try { recognition.start(); } catch (e) {}
                        }
                    }, 220);
                }
            };
            try { recognition.start(); } catch (e) {}
        }

        function connectLiveWebSocket() {
            ws = new WebSocket(`${WS_LIVE_URL}?user=${encodeURIComponent(currentUser)}&personality=${encodeURIComponent(currentPersona)}`);
            ws.onopen = () => {
                lastPingSentAt = performance.now();
                ws.send(JSON.stringify({ type: "ping" }));
            };
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === "pong") {
                        const rtt = Math.round(performance.now() - lastPingSentAt);
                        const pb = document.getElementById('pingBadge');
                        if (pb) pb.innerText = `•⚡${rtt}ms`;
                    } else if (data.type === "state" && data.status === "thinking") {
                        document.getElementById('liveStateText').innerText = "⚡ KIZA THINKING...";
                    } else if (data.type === "response") {
                        document.getElementById('aiSubtitleBox').innerText = data.text || "";
                        playLiveAudio(data.audio_base64, data.text);
                    } else if (data.type === "error") {
                        isWaitingResponse = false;
                        document.getElementById('aiSubtitleBox').innerText = `Notice: ${data.message}`;
                        document.getElementById('liveStateText').innerText = "🎙️ KIZA LISTENING...";
                    }
                } catch (e) {}
            };
            ws.onclose = () => {
                setTimeout(connectLiveWebSocket, 2500);
            };
        }

        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                lastPingSentAt = performance.now();
                ws.send(JSON.stringify({ type: "ping" }));
            }
        }, 12000);

        function endLiveCall() {
            micActive = false;
            if (recognition) { try { recognition.stop(); } catch (e) {} }
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            if (camStream) camStream.getTracks().forEach(t => t.stop());
            if (screenStream) screenStream.getTracks().forEach(t => t.stop());
            if (liveMicStream) liveMicStream.getTracks().forEach(t => t.stop());
            if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} }
            window.location.href = "index.html";
        }

        window.addEventListener('DOMContentLoaded', () => {
            initCamera();
            connectLiveWebSocket();
            initLiveSpeechRecognition();
        });
    </script>
</body>
